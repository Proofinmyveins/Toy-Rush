<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Toy Rush - House Grand Prix</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0f141d; touch-action: none; user-select: none; -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: block; }

    /* МЕНЮ ТА UI */
    .screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20; display: none; flex-direction: column;
      justify-content: space-between; padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
      background: radial-gradient(circle at center, rgba(18,25,38,0.85) 0%, rgba(8,12,18,0.98) 100%);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .active-screen { display: flex; }

    .menu-header { text-align: center; margin-top: 15px; }
    .game-title {
      font-size: 34px; font-weight: 900; font-style: italic; letter-spacing: 2px;
      background: linear-gradient(180deg, #ffd32a 0%, #ff3f34 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(255, 63, 52, 0.4);
    }
    .game-subtitle { font-size: 12px; color: #a4b0be; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }

    .menu-content { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin: auto; }
    
    .btn-action {
      background: linear-gradient(180deg, #1e272e 0%, #0abde3 100%);
      border: 2px solid #48dbfb; color: #fff; padding: 14px 20px;
      font-size: 15px; font-weight: 800; border-radius: 14px; text-transform: uppercase;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 6px 15px rgba(10, 189, 227, 0.3); outline: none;
    }
    .btn-action:active { transform: scale(0.96); }
    .btn-secondary {
      background: rgba(44, 62, 80, 0.8); border: 1px solid rgba(255,255,255,0.2);
      box-shadow: none; font-size: 13px; padding: 12px;
    }

    /* Гараж */
    .card-selector {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 16px; text-align: center;
    }
    .card-title { font-size: 20px; font-weight: 800; color: #ffd32a; margin-bottom: 4px; }
    .card-desc { font-size: 12px; color: #c8d6e5; line-height: 1.4; }

    /* Ігровий HUD */
    #hud {
      position: fixed; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
      display: none; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none;
    }
    .hud-chip {
      background: rgba(12, 17, 27, 0.9); padding: 8px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2); font-size: 13px; font-weight: 800;
    }
    .hud-interactive { pointer-events: auto; }

    /* Сенсорне керування */
    #touch-controls {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 16px) + 8px);
      left: 0; right: 0; display: none; justify-content: space-between; padding: 0 16px;
      z-index: 10; pointer-events: none;
    }
    .control-col { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
    .t-btn {
      width: 66px; height: 66px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(20, 26, 40, 0.88);
      color: #fff; font-size: 24px; font-weight: bold; display: flex;
      align-items: center; justify-content: center; outline: none;
    }
    .t-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.92); }
    #b-rst { width: 44px; height: 44px; font-size: 16px; background: rgba(235, 77, 75, 0.85); }
    #b-act { background: rgba(240, 147, 43, 0.9); display: none; }
  </style>
</head>
<body>

  <!-- ГОЛОВНЕ МЕНЮ -->
  <div id="screen-main" class="screen active-screen">
    <div class="menu-header">
      <div class="game-title">TOY RUSH</div>
      <div class="game-subtitle">House Grand Prix • Re-Volt Edition</div>
    </div>
    <div class="menu-content">
      <button class="btn-action" onclick="showScreen('screen-garage')">🏁 Гонка по будинку</button>
      <button class="btn-action btn-secondary" onclick="alert('Підключення 2-х телефонів буде увімкнено після затвердження геометрії кімнат!')">👥 Онлайн Мультиплеєр</button>
      <button class="btn-action btn-secondary" onclick="alert('Локація: Двоповерховий будинок\nКімнати: Вітальня, Кухня, Кабінет, Спальня\nРушій: WebGL Three.js')">ℹ️ Про карту</button>
    </div>
    <div style="text-align:center; font-size:11px; color:#636e72;">RC Micro Machines Simulation</div>
  </div>

  <!-- ГАРАЖ -->
  <div id="screen-garage" class="screen">
    <div class="menu-header">
      <div class="game-title" style="font-size:24px;">ГАРАЖ RC</div>
      <div class="game-subtitle">Оберіть болід для перегонів</div>
    </div>
    <div class="menu-content">
      <div class="card-selector">
        <div class="card-title" id="car-name">RC BANDIT</div>
        <div class="card-desc" id="car-stats">Тип: Багі • Швидкість: 8/10 • Кермо: 9/10</div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn-action btn-secondary" style="flex:1;" onclick="prevCar()">◀</button>
        <button class="btn-action btn-secondary" style="flex:1;" onclick="nextCar()">▶</button>
      </div>
      <button class="btn-action" onclick="startRace()">Старт гонки! 🚦</button>
      <button class="btn-action btn-secondary" onclick="showScreen('screen-main')">Назад</button>
    </div>
    <div></div>
  </div>

  <!-- ІГРОВИЙ HUD -->
  <div id="hud">
    <div class="hud-chip">🏎️ <span id="hud-spd">0</span> км/год · Коло <span id="hud-lap">1</span>/3</div>
    <div class="hud-chip hud-interactive" style="background:#d63031; cursor:pointer;" onclick="exitToMenu()">✕ Меню</div>
  </div>

  <!-- КЕРУВАННЯ -->
  <div id="touch-controls">
    <div class="control-col">
      <button class="t-btn" id="b-left">◀</button>
      <button class="t-btn" id="b-right">▶</button>
      <button class="t-btn" id="b-rst">↺</button>
    </div>
    <div class="control-col">
      <button class="t-btn" id="b-act">⚡</button>
      <button class="t-btn" id="b-down">▼</button>
      <button class="t-btn" id="b-up">▲</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- ДАНІ МАШИН ---
    const CARS = [
      { id: 0, name: 'RC BANDIT', color: 0xe67e22, stats: 'Тип: Багі • Баланс швидкості та зчеплення', spd: 32, acc: 26, steer: 3.3 },
      { id: 1, name: 'COL. MOSS', color: 0x27ae60, stats: 'Тип: Монстр-трак • Висока підвіска, таранна міць', spd: 28, acc: 32, steer: 2.8 },
      { id: 2, name: 'TOYECA RC', color: 0x0984e3, stats: 'Тип: Спорткар • Найвища швидкість, дрифт', spd: 36, acc: 24, steer: 3.5 }
    ];

    let selectedCarIdx = 0;
    let inRace = false;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
      const sc = document.getElementById(id);
      if (sc) sc.classList.add('active-screen');
    }
    function updateGarageUI() {
      const c = CARS[selectedCarIdx];
      document.getElementById('car-name').textContent = c.name;
      document.getElementById('car-stats').textContent = c.stats;
    }
    function prevCar() { selectedCarIdx = (selectedCarIdx - 1 + CARS.length) % CARS.length; updateGarageUI(); }
    function nextCar() { selectedCarIdx = (selectedCarIdx + 1) % CARS.length; updateGarageUI(); }

    // --- 3D СЦЕНА ТА ОСВІТЛЕННЯ КІМНАТ ---
    const S = new THREE.Scene();
    S.background = new THREE.Color(0x1a2130);
    S.fog = new THREE.Fog(0x1a2130, 90, 320);

    const C = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
    const R = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    R.setSize(innerWidth, innerHeight);
    R.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    R.toneMapping = THREE.ACESFilmicToneMapping;
    R.toneMappingExposure = 1.3;
    document.body.appendChild(R.domElement);

    // Затишне домашнє освітлення (люстри та сонце з вікон)
    S.add(new THREE.AmbientLight(0xffeedb, 1.1));
    const sunLight = new THREE.DirectionalLight(0xfffae8, 1.2);
    sunLight.position.set(60, 90, 50);
    S.add(sunLight);

    // --- ПРОЦЕДУРНІ ТЕКСТУРИ ПІДЛОГИ ДЛЯ КОЖНОЇ КІМНАТИ ---
    function makeTileTexture(c1, c2, size) {
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = c1; ctx.fillRect(0,0,256,256);
      ctx.fillStyle = c2;
      for (let x=0; x<256; x+=size*2) {
        for (let y=0; y<256; y+=size*2) {
          ctx.fillRect(x, y, size, size);
          ctx.fillRect(x+size, y+size, size, size);
        }
      }
      const t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 12);
      return t;
    }

    function makeWoodTexture() {
      const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#8e5b34'; ctx.fillRect(0,0,512,512);
      ctx.fillStyle = '#a0683c';
      for (let y=0; y<512; y+=64) ctx.fillRect(0, y, 512, 30);
      ctx.strokeStyle = '#5c381e'; ctx.lineWidth = 3;
      for (let y=0; y<=512; y+=32) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(512,y); ctx.stroke(); }
      const t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10);
      return t;
    }

    // Підлога різних кімнат
    const houseGroup = new THREE.Group();
    S.add(houseGroup);

    const parquetMat = new THREE.MeshLambertMaterial({ map: makeWoodTexture() });
    const tileMat = new THREE.MeshLambertMaterial({ map: makeTileTexture('#f5f6fa', '#2f3640', 32) });
    const carpetMat = new THREE.MeshLambertMaterial({ color: 0x3867d6 });
    const kidsMat = new THREE.MeshLambertMaterial({ color: 0xf7b731 });

    // 4 великі кімнати (розмір будинку 160 x 160)
    function addFloor(x, z, w, d, mat) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, 0.02, z);
      houseGroup.add(m);
    }
    addFloor(-40, 40, 80, 80, parquetMat);  // 1. ВІТАЛЬНЯ (Living Room)
    addFloor(40, 40, 80, 80, tileMat);     // 2. КУХНЯ (Kitchen)
    addFloor(40, -40, 80, 80, kidsMat);    // 3. КАБІНЕТ / ДИТЯЧА (Playroom)
    addFloor(-40, -40, 80, 80, carpetMat); // 4. СПАЛЬНЯ (Bedroom)

    // Масив твердих тіл (стіни та меблі, крізь які не можна проїхати)
    const solidColliders = [];

    function addSolidBox(x, y, z, w, h, d, color, matType = 'lambert') {
      const mat = matType === 'phong' 
        ? new THREE.MeshPhongMaterial({ color, shininess: 40 })
        : new THREE.MeshLambertMaterial({ color });
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y + h / 2, z);
      houseGroup.add(m);
      solidColliders.push({ x, z, hw: w / 2, hd: d / 2 });
      return m;
    }

    // --- СТІНИ БУДИНКУ З ДВЕРНИМИ ПРОЙОМАМИ ---
    const wallColor = 0xdcdde1;
    const wallH = 14;

    // Зовнішні глухі стіни (периметр будинку)
    addSolidBox(0, 0, -80, 162, wallH, 2, wallColor);
    addSolidBox(0, 0, 80, 162, wallH, 2, wallColor);
    addSolidBox(-80, 0, 0, 2, wallH, 162, wallColor);
    addSolidBox(80, 0, 0, 2, wallH, 162, wallColor);

    // ВНУТРІШНІ СТІНИ З ДВЕРИМА:
    // Горизонтальна стіна (ділить верх і низ): двері ліворуч (x = -40) та праворуч (x = 40)
    addSolidBox(0, 0, 0, 36, wallH, 2.5, wallColor);        // центральний блок
    addSolidBox(-68, 0, 0, 24, wallH, 2.5, wallColor);      // ліве крило
    addSolidBox(68, 0, 0, 24, wallH, 2.5, wallColor);       // праве крило
    // Проходи між кімнатами: біля x = -40 (двері спальня-вітальня) та x = 40 (кабінет-кухня)

    // Вертикальна стіна (ділить ліворуч і праворуч): двері внизу (z = 40) та вгорі (z = -40)
    addSolidBox(0, 0, 0, 2.5, wallH, 36, wallColor);        // центральний блок
    addSolidBox(0, 0, 68, 2.5, wallH, 24, wallColor);       // нижнє крило
    addSolidBox(0, 0, -68, 2.5, wallH, 24, wallColor);      // верхнє крило
    // Проходи: біля z = 40 (двері вітальня-кухня) та z = -40 (спальня-кабінет)

    // --- МЕБЛІ ТА ПРЕДМЕТИ В КІМНАТАХ ---

    // 1. ВІТАЛЬНЯ (x: -40, z: 40)
    // Великий диван
    addSolidBox(-65, 0, 40, 12, 6, 28, 0x4b6584);
    // Журнальний столик та килим
    addSolidBox(-45, 0, 40, 14, 2.5, 14, 0x6d4c41);
    // Тумба під телевізор біля стіни
    addSolidBox(-22, 0, 68, 26, 4, 6, 0x2f3542);
    // Телевізор
    addSolidBox(-22, 4, 68, 20, 10, 1.5, 0x111111);

    // 2. КУХНЯ (x: 40, z: 40)
    // Холодильник
    addSolidBox(70, 0, 68, 12, 18, 12, 0xf1f2f6, 'phong');
    // Кухонний острів
    addSolidBox(40, 0, 68, 30, 6, 8, 0x57606f);
    // ОБІДНІЙ СТІЛ (ніжки тверді, стільниця нагорі — під ним можна мчати на швидкості!)
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(26, 1.2, 20), new THREE.MeshLambertMaterial({ color: 0x833471 }));
    tableTop.position.set(45, 7.5, 30);
    houseGroup.add(tableTop);
    // Тверді ніжки столу (як у Re-Volt — slalom!)
    [[-11, -8], [11, -8], [-11, 8], [11, 8]].forEach(leg => {
      addSolidBox(45 + leg[0], 0, 30 + leg[1], 1.4, 7.5, 1.4, 0x2c2c54);
    });

    // 3. КАБІНЕТ / ДИТЯЧА (x: 40, z: -40)
    // Письмовий стіл
    addSolidBox(65, 0, -40, 14, 7, 28, 0x3B3B98);
    // Комп'ютерний монітор
    addSolidBox(65, 7, -40, 1.5, 6, 10, 0x1e272e);
    // ТРАМПЛІН: Товста книга-словник, нахилена як рампа
    const bookRamp = new THREE.Mesh(new THREE.BoxGeometry(16, 1.2, 14), new THREE.MeshLambertMaterial({ color: 0xe74c3c }));
    bookRamp.rotation.x = -0.25; // підйом угору в бік спальні
    bookRamp.position.set(38, 1.8, -25);
    houseGroup.add(bookRamp);

    // 4. СПАЛЬНЯ (x: -40, z: -40)
    // Велике двоспальне ліжко
    addSolidBox(-45, 0, -50, 32, 5.5, 26, 0x1289A5);
    // Подушки
    addSolidBox(-54, 5.5, -50, 6, 2, 20, 0xffffff);
    // Шафа для одягу
    addSolidBox(-70, 0, -25, 8, 16, 20, 0x596275);

    // --- МОДЕЛЬ МАШИНКИ RE-VOLT ---
    const carGroup = new THREE.Group();
    S.add(carGroup);

    function buildCarModel(colorHex) {
      while (carGroup.children.length > 0) carGroup.remove(carGroup.children[0]);

      // Тінь на підлозі
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(3.0, 4.8),
        new THREE.MeshBasicMaterial({ color: 0x05070a, transparent: true, opacity: 0.6 })
      );
      shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.05;
      carGroup.add(shadow);

      const bodyG = new THREE.Group();
      carGroup.add(bodyG);

      const paint = new THREE.MeshPhongMaterial({ color: colorHex, shininess: 95 });
      const glass = new THREE.MeshPhongMaterial({ color: 0x0d131a, shininess: 100 });
      const chrome = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.1 });
      const tireMat = new THREE.MeshLambertMaterial({ color: 0x151515 });

      // Ніс багі
      const nose = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.0, 1.8, 4), paint);
      nose.rotation.y = Math.PI / 4; nose.rotation.x = Math.PI / 2; nose.position.set(0, 0.48, 1.3);
      bodyG.add(nose);

      // Кузов
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 2.6), paint);
      chassis.position.set(0, 0.55, -0.4); bodyG.add(chassis);

      // Скляна кабіна
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.45, 1.5), glass);
      cabin.position.set(0, 0.92, -0.3); bodyG.add(cabin);

      // Спойлер
      const wing = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.08, 0.7), paint);
      wing.position.set(0, 1.35, -1.7); bodyG.add(wing);

      // Антена
      const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.6), chrome);
      ant.position.set(0, 1.8, -1.2); bodyG.add(ant);

      // Фари (справжні світлові промені!)
      for (let fx of [-0.65, 0.65]) {
        const lightMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0xfffa65 }));
        lightMesh.position.set(fx, 0.5, 2.1); bodyG.add(lightMesh);
      }
      const carHeadlight = new THREE.SpotLight(0xfffa65, 2.5, 45, Math.PI / 6, 0.5);
      carHeadlight.position.set(0, 0.6, 1.8);
      const lightTarget = new THREE.Object3D();
      lightTarget.position.set(0, 0.6, 15);
      bodyG.add(lightTarget);
      carHeadlight.target = lightTarget;
      bodyG.add(carHeadlight);

      // Колеса
      [[-1.25, 1.2], [1.25, 1.2], [-1.35, -1.2], [1.35, -1.2]].forEach(pos => {
        const w = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.45, 16), tireMat);
        w.rotation.z = Math.PI / 2; w.position.set(pos[0], 0.46, pos[1]);
        carGroup.add(w);
      });
    }

    // --- ЧЕКПОЇНТИ (МАРШРУТ ЧЕРЕЗ ВСІ КІМНАТИ БУДИНКУ) ---
    const checkpoints = [
      { x: -40, z: 20, desc: 'Вітальня (Старт)' },
      { x: 0,   z: 40, desc: 'Двері на кухню' },
      { x: 45,  z: 30, desc: 'Кухня (Під столом)' },
      { x: 40,  z: 0,  desc: 'Двері в дитячу' },
      { x: 38,  z: -25, desc: 'Книга-трамплін' },
      { x: 0,   z: -40, desc: 'Двері в спальню' },
      { x: -40, z: -20, desc: 'Спальня біля ліжка' },
      { x: -40, z: 0,   desc: 'Двері назад у вітальню' }
    ];

    // Фізичні змінні машинки
    let px = -40, py = 0, pz = 20, pvx = 0, pvy = 0, pvz = 0, pa = Math.PI / 2, speed = 0;
    let currentCp = 0, lap = 1;
    const I = { l: 0, r: 0, g: 0, b: 0 };

    function bind(id, k) {
      const e = document.getElementById(id);
      if (!e) return;
      e.addEventListener('touchstart', ev => { ev.preventDefault(); I[k] = 1; }, { passive: false });
      e.addEventListener('touchend', ev => { ev.preventDefault(); I[k] = 0; }, { passive: false });
      e.addEventListener('touchcancel', ev => { ev.preventDefault(); I[k] = 0; }, { passive: false });
    }
    bind('b-left', 'l'); bind('b-right', 'r'); bind('b-up', 'g'); bind('b-down', 'b');

    document.getElementById('b-rst').onclick = () => {
      const cp = checkpoints[currentCp];
      px = cp.x; pz = cp.z; py = 0.5; speed = 0;
    };

    function startRace() {
      inRace = true;
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('touch-controls').style.display = 'flex';
      buildCarModel(CARS[selectedCarIdx].color);
      px = -40; py = 0; pz = 20; pa = Math.PI / 2; speed = 0; lap = 1; currentCp = 0;
    }

    function exitToMenu() {
      inRace = false;
      document.getElementById('hud').style.display = 'none';
      document.getElementById('touch-controls').style.display = 'none';
      showScreen('screen-main');
    }

    // --- НАДІЙНА ФІЗИКА ЗІТКНЕННЯ ЗІ СТІНАМИ ТА МЕБЛЯМИ ---
    function resolveHouseCollisions() {
      const carRadius = 1.35;

      for (let box of solidColliders) {
        // Знаходимо найближчу точку прямокутника до центру машинки
        const cx = Math.max(box.x - box.hw, Math.min(box.x + box.hw, px));
        const cz = Math.max(box.z - box.hd, Math.min(box.z + box.hd, pz));

        const dx = px - cx;
        const dz = pz - cz;
        const distSq = dx * dx + dz * dz;

        if (distSq < carRadius * carRadius) {
          const dist = Math.sqrt(distSq) || 0.001;
          const overlap = carRadius - dist;

          // Виштовхуємо машинку з перешкоди
          px += (dx / dist) * overlap;
          pz += (dz / dist) * overlap;

          // Пружний відскок і гальмування
          speed *= -0.35;
          pvx = (dx / dist) * 8;
          pvz = (dz / dist) * 8;
        }
      }
    }

    let lastT = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min((now - lastT) / 1000, 0.05);
      lastT = now;

      if (inRace) {
        const carData = CARS[selectedCarIdx];
        if (I.g) speed += carData.acc * dt;
        if (I.b) speed -= 36 * dt;
        speed *= 0.985;
        speed = Math.max(-9, Math.min(carData.spd, speed));

        const steer = (I.r ? 1 : 0) - (I.l ? 1 : 0);
        pa -= steer * carData.steer * dt * (Math.abs(speed) / 14 + 0.25) * (speed >= -0.1 ? 1 : -1);

        pvx += (Math.sin(pa) * speed - pvx) * 9 * dt;
        pvz += (Math.cos(pa) * speed - pvz) * 9 * dt;
        px += pvx * dt;
        pz += pvz * dt;

        // Перевірка зіткнень зі стінами та меблями
        resolveHouseCollisions();

        // Стрибок на книзі-трампліні в дитячій
        if (Math.abs(px - 38) < 8 && Math.abs(pz - (-25)) < 7) {
          py = Math.max(0, (-25 - pz) * 0.3);
          if (speed > 16 && pz < -28) {
            pvy = speed * 0.3; // підкидання в повітря
          }
        }
        if (py > 0 || pvy > 0) {
          pvy -= 38 * dt; py += pvy * dt;
          if (py <= 0) { py = 0; pvy = 0; }
        }

        carGroup.position.set(px, py + 0.05, pz);
        carGroup.rotation.y = pa;

        // Перевірка чекпоїнтів
        const target = checkpoints[currentCp];
        if (Math.hypot(px - target.x, pz - target.z) < 12) {
          currentCp = (currentCp + 1) % checkpoints.length;
          if (currentCp === 0) {
            lap++;
            if (lap > 3) lap = 3;
          }
        }

        document.getElementById('hud-spd').textContent = Math.round(Math.abs(speed) * 7.5);
        document.getElementById('hud-lap').textContent = lap;

        // Камера слідує за машинкою
        C.position.lerp(new THREE.Vector3(px - Math.sin(pa) * 11, py + 5.5, pz - Math.cos(pa) * 11), 0.15);
        C.lookAt(px, py + 1.2, pz);
      } else {
        // Огляд будинку в головному меню
        const t = now * 0.00025;
        C.position.set(Math.sin(t) * 95, 65, Math.cos(t) * 95);
        C.lookAt(0, 0, 0);
      }

      R.render(S, C);
    }
    tick(performance.now());

    window.addEventListener('resize', () => {
      C.aspect = innerWidth / innerHeight;
      C.updateProjectionMatrix();
      R.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
