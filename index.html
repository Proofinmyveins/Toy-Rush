<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Toy Rush 3D - Re-Volt</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #5c8ca8; touch-action: none;
      -webkit-user-select: none; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 1; display: block; }
    #top-bar {
      position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none;
    }
    #hud {
      background: rgba(12, 16, 26, 0.9); color: #fff; padding: 7px 12px;
      border-radius: 12px; font-size: 13px; font-weight: 700; display: flex; gap: 8px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
    }
    .top-btns { display: flex; gap: 6px; pointer-events: auto; }
    .ui-btn {
      height: 40px; padding: 0 11px; background: rgba(12, 16, 26, 0.9);
      border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; color: #fff;
      font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #powerup-slot { width: 40px; font-size: 20px; border-color: #ffca28; }
    #c {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 16px) + 8px);
      left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px;
      z-index: 10; pointer-events: none;
    }
    .g { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
    button {
      width: 66px; height: 66px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(20, 24, 35, 0.85);
      color: #fff; font-size: 24px; font-weight: bold; display: flex;
      align-items: center; justify-content: center; outline: none;
    }
    button:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.93); }
    #ACT { background: rgba(255, 179, 0, 0.95); border-color: #ffe082; display: none; }
    #RST { width: 46px; height: 46px; font-size: 18px; background: rgba(190, 35, 35, 0.9); }
    
    .dropdown {
      position: fixed; top: 60px; right: 10px; background: rgba(12, 16, 26, 0.96);
      padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); display: none;
      flex-direction: column; gap: 8px; z-index: 30;
    }
    .dropdown button {
      width: 155px; height: 38px; border-radius: 10px; font-size: 13px;
      background: #232b3d; border: 1px solid #ffffff22;
    }
    #finish-banner {
      position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.92); color: #ffd700; border: 3px solid #ffd700;
      padding: 16px 28px; border-radius: 20px; font-size: 26px; font-weight: 900;
      text-align: center; z-index: 100; display: none; text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="finish-banner">🏁 ФІНІШ! 🏆<br><span style="font-size:16px;color:#fff;">Всі кола пройдено!</span></div>

  <div id="top-bar">
    <div id="hud">
      <span>🏎️ <span id="s">0</span></span>
      <span>🏁 <span id="l">1</span>/3</span>
      <span>🏆 <span id="pos">1</span></span>
    </div>
    <div class="top-btns">
      <div id="powerup-slot" class="ui-btn">❓</div>
      <div id="garage-btn" class="ui-btn">🚗 Гараж</div>
      <div id="map-btn" class="ui-btn">🗺️ Траса</div>
    </div>
  </div>

  <div id="garage-menu" class="dropdown">
    <button onclick="selectCar(0)">🏎️ Багі (Bandit)</button>
    <button onclick="selectCar(1)">🛞 Монстр (Moss)</button>
    <button onclick="selectCar(2)">⚡ Спорткар (Toyeca)</button>
  </div>

  <div id="track-menu" class="dropdown">
    <button onclick="loadTrack(0)">🧸 Велика спальня</button>
    <button onclick="loadTrack(1)">🍳 Кухня-Гран-прі</button>
  </div>

  <div id="c">
    <div class="g">
      <button id="L">◀</button>
      <button id="R">▶</button>
      <button id="RST">↺</button>
    </div>
    <div class="g">
      <button id="ACT">⚡</button>
      <button id="B">▼</button>
      <button id="G">▲</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const S = new THREE.Scene();
    S.background = new THREE.Color(0x5c8ca8);
    S.fog = new THREE.Fog(0x5c8ca8, 70, 260);

    const C = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
    const R = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    R.setSize(innerWidth, innerHeight);
    R.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    R.toneMapping = THREE.ACESFilmicToneMapping;
    R.toneMappingExposure = 1.15;
    document.body.appendChild(R.domElement);

    S.add(new THREE.AmbientLight(0xfff6ec, 1.2));
    const sun = new THREE.DirectionalLight(0xfffaed, 1.0);
    sun.position.set(45, 80, 40);
    S.add(sun);
    const skyLight = new THREE.DirectionalLight(0x7fb3d5, 0.4);
    skyLight.position.set(-40, 30, -40);
    S.add(skyLight);

    // --- ПРОЦЕДУРНІ ТЕКСТУРИ ВИСОКОЇ ДЕТАЛІЗАЦІЇ ---
    function makeRoadTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      // Зернистий асфальт
      ctx.fillStyle = '#22252a';
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#1c1f24';
      for (let i = 0; i < 4000; i++) {
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }
      // Білі суцільні бічні смуги
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(16, 0, 18, 512);
      ctx.fillRect(478, 0, 18, 512);
      // Жовта пунктирна осьова лінія
      ctx.fillStyle = '#fbc531';
      for (let y = 16; y < 512; y += 64) {
        ctx.fillRect(248, y, 16, 36);
      }
      const t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    }

    function makeFloorTexture(col1, col2, gridSize) {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = col1;
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = col2;
      for (let y = 0; y < 256; y += gridSize) {
        ctx.fillRect(0, y, 256, 2);
        ctx.fillRect(y, 0, 2, 256);
      }
      const t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(16, 16);
      return t;
    }

    const roadTex = makeRoadTexture();
    const asphaltMat = new THREE.MeshLambertMaterial({ map: roadTex });
    const floorMat = new THREE.MeshLambertMaterial({ map: makeFloorTexture('#a38460', '#836544', 32) });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), floorMat);
    floor.rotation.x = -Math.PI / 2;
    S.add(floor);

    // Зовнішні стіни кімнати
    function buildRoom(size) {
      const g = new THREE.Group();
      const wMat = new THREE.MeshLambertMaterial({ color: 0xd6cbb8 });
      const b = (x, z, w, d) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, 12, d), wMat);
        m.position.set(x, 6, z);
        g.add(m);
      };
      b(0, -size, size * 2 + 6, 6);
      b(0, size, size * 2 + 6, 6);
      b(-size, 0, 6, size * 2 + 6);
      b(size, 0, 6, size * 2 + 6);
      S.add(g);
    }
    buildRoom(90);

    // --- СИСТЕМА ЧАСТИНОК (ДИМ ТА ПИЛ З-ПІД КОЛІС) ---
    const particles = [];
    const pGeo = new THREE.SphereGeometry(0.18, 6, 6);
    const pMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.5 });
    for (let i = 0; i < 30; i++) {
      const m = new THREE.Mesh(pGeo, pMat.clone());
      m.visible = false;
      S.add(m);
      particles.push({ mesh: m, life: 0 });
    }
    function emitSmoke(x, y, z) {
      const p = particles.find(pt => pt.life <= 0);
      if (!p) return;
      p.mesh.position.set(x + (Math.random() - 0.5) * 0.4, y, z + (Math.random() - 0.5) * 0.4);
      p.mesh.scale.setScalar(1);
      p.mesh.material.opacity = 0.55;
      p.mesh.visible = true;
      p.life = 0.45;
    }

    // --- МОДЕЛІ МАШИНОК З ГАРАЖА ---
    const carProfiles = [
      { name: 'RC-Bandit', color: 0xe84118, type: 'buggy', spd: 31, acc: 25, steer: 3.2, mass: 1.0 },
      { name: 'Col-Moss', color: 0x2e7d32, type: 'monster', spd: 27, acc: 30, steer: 2.7, mass: 1.6 },
      { name: 'Toyeca', color: 0x1565c0, type: 'sport', spd: 35, acc: 23, steer: 3.4, mass: 0.9 }
    ];

    function createVehicle(profile) {
      const root = new THREE.Group();
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      // Контактна тінь
      const shadowMat = new THREE.MeshBasicMaterial({ color: 0x101010, transparent: true, opacity: 0.5 });
      const shadow = new THREE.Mesh(new THREE.PlaneGeometry(profile.type === 'monster' ? 3.8 : 3.0, 4.8), shadowMat);
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.05;
      root.add(shadow);

      const mainMat = new THREE.MeshPhongMaterial({ color: profile.color, shininess: 85 });
      const glassMat = new THREE.MeshPhongMaterial({ color: 0x111c26, shininess: 100 });
      const chromeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });
      const blackMat = new THREE.MeshLambertMaterial({ color: 0x161616 });

      const wheels = [];

      if (profile.type === 'buggy') {
        // Багі
        const b = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 3.6), mainMat);
        b.position.y = 0.6; bodyGroup.add(b);
        const c = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 1.8), glassMat);
        c.position.set(0, 0.98, -0.1); bodyGroup.add(c);
        const w = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.08, 0.7), mainMat);
        w.position.set(0, 1.45, -1.6); bodyGroup.add(w);

        [[-1.25, 1.3, 0.42, 0.38], [1.25, 1.3, 0.42, 0.38], [-1.35, -1.3, 0.52, 0.55], [1.35, -1.3, 0.52, 0.55]].forEach(cfg => {
          const wg = new THREE.Group();
          const t = new THREE.Mesh(new THREE.CylinderGeometry(cfg[2], cfg[2], cfg[3], 14), blackMat);
          t.rotation.z = Math.PI / 2;
          const rim = new THREE.Mesh(new THREE.CylinderGeometry(cfg[2]*0.55, cfg[2]*0.55, cfg[3]+0.02, 8), chromeMat);
          rim.rotation.z = Math.PI / 2;
          wg.add(t); wg.add(rim);
          wg.position.set(cfg[0], cfg[2], cfg[1]);
          root.add(wg); wheels.push(wg);
        });
      } else if (profile.type === 'monster') {
        // Монстр-трак
        const b = new THREE.Mesh(new THREE.BoxGeometry(2.3, 1.0, 4.0), mainMat);
        b.position.y = 1.35; bodyGroup.add(b);
        const c = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.75, 2.0), glassMat);
        c.position.set(0, 2.05, 0.1); bodyGroup.add(c);
        // Захисна решітка
        const grill = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 0.3), chromeMat);
        grill.position.set(0, 1.1, 2.1); bodyGroup.add(grill);

        [[-1.6, 1.4, 0.72, 0.7], [1.6, 1.4, 0.72, 0.7], [-1.6, -1.4, 0.72, 0.7], [1.6, -1.4, 0.72, 0.7]].forEach(cfg => {
          const wg = new THREE.Group();
          const t = new THREE.Mesh(new THREE.CylinderGeometry(cfg[2], cfg[2], cfg[3], 16), blackMat);
          t.rotation.z = Math.PI / 2;
          const rim = new THREE.Mesh(new THREE.CylinderGeometry(cfg[2]*0.5, cfg[2]*0.5, cfg[3]+0.04, 8), mainMat);
          rim.rotation.z = Math.PI / 2;
          wg.add(t); wg.add(rim);
          wg.position.set(cfg[0], cfg[2], cfg[1]);
          root.add(wg); wheels.push(wg);
        });
      } else {
        // Спорткар Toyeca
        const b = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.55, 4.2), mainMat);
        b.position.y = 0.5; bodyGroup.add(b);
        const c = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 2.1), glassMat);
        c.position.set(0, 0.9, -0.2); bodyGroup.add(c);
        const diff = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.15, 0.4), blackMat);
        diff.position.set(0, 0.35, -2.15); bodyGroup.add(diff);

        [[-1.2, 1.35, 0.44, 0.4], [1.2, 1.35, 0.44, 0.4], [-1.2, -1.35, 0.46, 0.48], [1.2, -1.35, 0.46, 0.48]].forEach(cfg => {
          const wg = new THREE.Group();
          const t = new THREE.Mesh(new THREE.CylinderGeometry(cfg[2], cfg[2], cfg[3], 14), blackMat);
          t.rotation.z = Math.PI / 2;
          const rim = new THREE.Mesh(new THREE.CylinderGeometry(cfg[2]*0.6, cfg[2]*0.6, cfg[3]+0.02, 8), chromeMat);
          rim.rotation.z = Math.PI / 2;
          wg.add(t); wg.add(rim);
          wg.position.set(cfg[0], cfg[2], cfg[1]);
          root.add(wg); wheels.push(wg);
        });
      }

      // Антена з червоним наконечником
      const ant = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.6), chromeMat);
      pole.position.y = 1.3;
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3300 }));
      tip.position.y = 2.6;
      ant.position.set(0, 1.2, -1.3);
      ant.add(pole); ant.add(tip);
      bodyGroup.add(ant);

      S.add(root);
      return { root, bodyGroup, antenna: ant, wheels, profile };
    }

    // --- ДЕКОРАЦІЇ КІМНАТИ ---
    function createPencil(x, z, len, rotY, hex) {
      const g = new THREE.Group();
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, len, 6), new THREE.MeshLambertMaterial({ color: hex }));
      b.rotation.z = Math.PI / 2; b.position.y = 0.9; g.add(b);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.2, 6), new THREE.MeshLambertMaterial({ color: 0xdfba89 }));
      tip.rotation.z = -Math.PI / 2; tip.position.set(len/2 + 1.1, 0.9, 0); g.add(tip);
      g.rotation.y = rotY; g.position.set(x, 0, z);
      return g;
    }

    function createBattery(x, z) {
      const g = new THREE.Group();
      const b = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 9, 20), new THREE.MeshPhongMaterial({ color: 0x242424 }));
      b.position.y = 4.5; g.add(b);
      const top = new THREE.Mesh(new THREE.CylinderGeometry(2.42, 2.42, 2.2, 20), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9 }));
      top.position.y = 7.9; g.add(top);
      g.position.set(x, 0, z);
      return g;
    }

    function createBookStack(x, z, rotY) {
      const g = new THREE.Group();
      const colors = [0xb71540, 0x0a3d62, 0x38ada9];
      for (let i = 0; i < 3; i++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(16, 2.5, 22), new THREE.MeshLambertMaterial({ color: colors[i] }));
        m.position.set(0, 1.25 + i * 2.5, 0);
        m.rotation.y = (i - 1) * 0.12;
        g.add(m);
      }
      g.rotation.y = rotY; g.position.set(x, 0, z);
      return g;
    }

    function createFinishArch(x, z, rotY) {
      const g = new THREE.Group();
      const pMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.6 });
      const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 9, 0.8), pMat); p1.position.set(-8.5, 4.5, 0);
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 9, 0.8), pMat); p2.position.set(8.5, 4.5, 0);
      const top = new THREE.Mesh(new THREE.BoxGeometry(18, 0.8, 0.8), pMat); top.position.set(0, 9, 0);
      const sign = new THREE.Mesh(new THREE.BoxGeometry(15, 2.8, 0.3), new THREE.MeshLambertMaterial({ color: 0xd63031 }));
      sign.position.set(0, 7.4, 0);
      g.add(p1); g.add(p2); g.add(top); g.add(sign);
      g.rotation.y = rotY; g.position.set(x, 0, z);
      return g;
    }

    // --- ТРАСИ ТА НАДІЙНІ ЧЕКПОЇНТИ ---
    const tracks = [
      {
        name: "Велика спальня",
        // Довгий замкнений маршрут по всій кімнаті
        checkpoints: [
          { x: 0, z: -55 }, { x: 45, z: -55 }, { x: 55, z: -25 }, { x: 25, z: 0 },
          { x: 55, z: 25 }, { x: 55, z: 55 }, { x: 0, z: 55 }, { x: -45, z: 55 },
          { x: -55, z: 20 }, { x: -20, z: -10 }, { x: -55, z: -35 }, { x: -25, z: -55 }
        ],
        roads: [
          { x: 0, z: -55, w: 90, d: 15, rot: 0 },
          { x: 55, z: 0, w: 15, d: 90, rot: 0 },
          { x: 0, z: 55, w: 90, d: 15, rot: 0 },
          { x: -55, z: 0, w: 15, d: 90, rot: 0 },
          { x: 5, z: 0, w: 15, d: 45, rot: 0.6 },
          { x: -5, z: 0, w: 15, d: 45, rot: -0.6 }
        ],
        props: [
          { type: 'books', x: 20, z: 20, rot: 0.3 },
          { type: 'pencil', x: -20, z: -35, len: 26, rot: 0.2, col: 0x4cd137 },
          { type: 'pencil', x: 25, z: -35, len: 24, rot: -0.4, col: 0x00a8ff },
          { type: 'battery', x: -30, z: 30 },
          { type: 'battery', x: 35, z: -15 }
        ],
        arch: { x: 0, z: -55, rot: 0 }
      },
      {
        name: "Кухня-Гран-прі",
        checkpoints: [
          { x: 0, z: -60 }, { x: 50, z: -40 }, { x: 60, z: 10 }, { x: 30, z: 50 },
          { x: -20, z: 60 }, { x: -60, z: 30 }, { x: -40, z: -20 }, { x: -20, z: -50 }
        ],
        roads: [
          { x: 0, z: -60, w: 80, d: 16, rot: 0 },
          { x: 55, z: -10, w: 16, d: 80, rot: 0.2 },
          { x: 10, z: 55, w: 85, d: 16, rot: -0.1 },
          { x: -50, z: 10, w: 16, d: 80, rot: -0.2 }
        ],
        props: [
          { type: 'battery', x: 0, z: 0 },
          { type: 'battery', x: 15, z: 0 },
          { type: 'battery', x: -15, z: 0 },
          { type: 'pencil', x: 0, z: 25, len: 32, rot: 0, col: 0xe84118 }
        ],
        arch: { x: 0, z: -60, rot: 0 }
      }
    ];

    let currentTrackIdx = 0;
    const trackGroup = new THREE.Group();
    S.add(trackGroup);

    const pickups = [];
    const pickupMat = new THREE.MeshLambertMaterial({ color: 0xffca28 });

    function buildTrack(idx) {
      while (trackGroup.children.length > 0) trackGroup.remove(trackGroup.children[0]);
      pickups.length = 0;

      const t = tracks[idx];
      t.roads.forEach(r => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(r.w, 0.08, r.d), asphaltMat);
        m.position.set(r.x, 0.04, r.z);
        m.rotation.y = r.rot || 0;
        trackGroup.add(m);
      });

      trackGroup.add(createFinishArch(t.arch.x, t.arch.z, t.arch.rot));

      t.props.forEach(p => {
        if (p.type === 'pencil') trackGroup.add(createPencil(p.x, p.z, p.len, p.rot, p.col));
        if (p.type === 'battery') trackGroup.add(createBattery(p.x, p.z));
        if (p.type === 'books') trackGroup.add(createBookStack(p.x, p.z, p.rot));
      });

      // Бонуси в 3 ключових точках треку
      [t.checkpoints[2], t.checkpoints[Math.floor(t.checkpoints.length / 2)], t.checkpoints[t.checkpoints.length - 2]].forEach(pos => {
        const p = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.8), pickupMat);
        p.position.set(pos.x, 1.3, pos.z);
        trackGroup.add(p);
        pickups.push({ mesh: p, active: true, respawn: 0 });
      });
    }

    // Створення болідів
    let playerCarIdx = 0;
    let player = createVehicle(carProfiles[playerCarIdx]);
    const aiCars = [
      { v: createVehicle(carProfiles[1]), x: -3.8, z: -55, a: Math.PI, spd: 18, cpIdx: 1, lap: 1 },
      { v: createVehicle(carProfiles[2]), x: 3.8, z: -55, a: Math.PI, spd: 17, cpIdx: 1, lap: 1 }
    ];

    let px = 0, pz = -55, pvx = 0, pvz = 0, pa = Math.PI, forwardSpeed = 0;
    let pLap = 1, nextCheckpoint = 1, boostTimer = 0, hasItem = false, isFinished = false;

    function resetPositions() {
      const curT = tracks[currentTrackIdx];
      const start = curT.checkpoints[0];
      px = start.x; pz = start.z;
      pvx = 0; pvz = 0; pa = Math.PI; forwardSpeed = 0;
      pLap = 1; nextCheckpoint = 1; isFinished = false;
      document.getElementById('finish-banner').style.display = 'none';

      aiCars[0].x = start.x - 3.8; aiCars[0].z = start.z; aiCars[0].a = Math.PI; aiCars[0].cpIdx = 1; aiCars[0].lap = 1;
      aiCars[1].x = start.x + 3.8; aiCars[1].z = start.z; aiCars[1].a = Math.PI; aiCars[1].cpIdx = 1; aiCars[1].lap = 1;
    }

    function selectCar(idx) {
      playerCarIdx = idx;
      S.remove(player.root);
      player = createVehicle(carProfiles[playerCarIdx]);
      document.getElementById('garage-menu').style.display = 'none';
      resetPositions();
    }

    function loadTrack(idx) {
      currentTrackIdx = idx;
      buildTrack(idx);
      resetPositions();
      document.getElementById('track-menu').style.display = 'none';
    }

    // Меню
    document.getElementById('garage-btn').onclick = () => {
      const g = document.getElementById('garage-menu');
      g.style.display = g.style.display === 'flex' ? 'none' : 'flex';
      document.getElementById('track-menu').style.display = 'none';
    };
    document.getElementById('map-btn').onclick = () => {
      const m = document.getElementById('track-menu');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
      document.getElementById('garage-menu').style.display = 'none';
    };

    // Керування
    const I = { l: 0, r: 0, g: 0, b: 0 };
    function bind(id, k) {
      const e = document.getElementById(id);
      if (!e) return;
      e.addEventListener('touchstart', ev => { ev.preventDefault(); I[k] = 1; }, { passive: false });
      e.addEventListener('touchend', ev => { ev.preventDefault(); I[k] = 0; }, { passive: false });
      e.addEventListener('touchcancel', ev => { ev.preventDefault(); I[k] = 0; }, { passive: false });
      e.addEventListener('mousedown', () => I[k] = 1);
      e.addEventListener('mouseup', () => I[k] = 0);
      e.addEventListener('mouseleave', () => I[k] = 0);
    }
    bind('L', 'l'); bind('R', 'r'); bind('G', 'g'); bind('B', 'b');

    const actBtn = document.getElementById('ACT');
    function usePowerup() {
      if (!hasItem) return;
      hasItem = false;
      boostTimer = 3.2;
      document.getElementById('powerup-slot').textContent = '❓';
      actBtn.style.display = 'none';
    }
    actBtn.addEventListener('touchstart', ev => { ev.preventDefault(); usePowerup(); }, { passive: false });
    actBtn.onclick = usePowerup;

    const rstBtn = document.getElementById('RST');
    function resetCar() {
      const curT = tracks[currentTrackIdx];
      const targetCp = curT.checkpoints[(nextCheckpoint - 1 + curT.checkpoints.length) % curT.checkpoints.length];
      px = targetCp.x; pz = targetCp.z;
      pvx = 0; pvz = 0; forwardSpeed = 0;
    }
    rstBtn.addEventListener('touchstart', ev => { ev.preventDefault(); resetCar(); }, { passive: false });
    rstBtn.onclick = resetCar;

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') I.l = 1;
      if (e.key === 'ArrowRight' || e.key === 'd') I.r = 1;
      if (e.key === 'ArrowUp' || e.key === 'w') I.g = 1;
      if (e.key === 'ArrowDown' || e.key === 's') I.b = 1;
      if (e.code === 'Space') usePowerup();
      if (e.key === 'r') resetCar();
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') I.l = 0;
      if (e.key === 'ArrowRight' || e.key === 'd') I.r = 0;
      if (e.key === 'ArrowUp' || e.key === 'w') I.g = 0;
      if (e.key === 'ArrowDown' || e.key === 's') I.b = 0;
    });

    // Відштовхування від стін кімнати
    function resolveWalls(entity) {
      if (entity.x > 84) { entity.x = 84; forwardSpeed *= -0.3; pvx = -10; }
      if (entity.x < -84) { entity.x = -84; forwardSpeed *= -0.3; pvx = 10; }
      if (entity.z > 84) { entity.z = 84; forwardSpeed *= -0.3; pvz = -10; }
      if (entity.z < -84) { entity.z = -84; forwardSpeed *= -0.3; pvz = 10; }
    }

    loadTrack(0);

    let lastTime = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Оновлення частинок диму
      particles.forEach(pt => {
        if (pt.life > 0) {
          pt.life -= dt;
          pt.mesh.position.y += dt * 0.8;
          pt.mesh.scale.addScalar(dt * 1.5);
          pt.mesh.material.opacity = (pt.life / 0.45) * 0.5;
          if (pt.life <= 0) pt.mesh.visible = false;
        }
      });

      const profile = player.profile;
      const maxSpd = boostTimer > 0 ? profile.spd * 1.45 : profile.spd;
      const accelRate = boostTimer > 0 ? profile.acc * 1.5 : profile.acc;
      if (boostTimer > 0) boostTimer -= dt;

      if (I.g) forwardSpeed += accelRate * dt;
      if (I.b) forwardSpeed -= 34 * dt;
      forwardSpeed *= 0.982;
      forwardSpeed = Math.max(-8, Math.min(maxSpd, forwardSpeed));

      // Кермо
      const steer = (I.r ? 1 : 0) - (I.l ? 1 : 0);
      const moveDirection = forwardSpeed >= -0.1 ? 1 : -1;
      pa -= steer * profile.steer * dt * (Math.abs(forwardSpeed) / 14 + 0.2) * moveDirection;

      // Фізика руху та дрифту
      const targetVx = Math.sin(pa) * forwardSpeed;
      const targetVz = Math.cos(pa) * forwardSpeed;
      pvx += (targetVx - pvx) * 8.8 * dt;
      pvz += (targetVz - pvz) * 8.8 * dt;

      px += pvx * dt;
      pz += pvz * dt;

      const playerEntity = { x: px, z: pz };
      resolveWalls(playerEntity);
      px = playerEntity.x; pz = playerEntity.z;

      // Дим з-під коліс під час різких поворотів або форсажу
      if ((Math.abs(steer) > 0 && Math.abs(forwardSpeed) > 16) || boostTimer > 0) {
        emitSmoke(px - Math.sin(pa) * 1.4, 0.2, pz - Math.cos(pa) * 1.4);
      }

      // Таран з AI суперниками
      aiCars.forEach(ai => {
        const dx = px - ai.x, dz = pz - ai.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 3.0 && dist > 0.01) {
          const nx = dx / dist, nz = dz / dist;
          const push = 3.0 - dist;
          px += nx * push * 0.5; pz += nz * push * 0.5;
          ai.x -= nx * push * 0.5; ai.z -= nz * push * 0.5;
          pvx += nx * 8; pvz += nz * 8;
          forwardSpeed *= 0.7;
        }
      });

      player.root.position.set(px, 0.05, pz);
      player.root.rotation.y = pa;
      player.bodyGroup.rotation.z = -steer * 0.15 * (Math.abs(forwardSpeed) / maxSpd);
      player.bodyGroup.rotation.x = (I.g ? -0.05 : 0) + (I.b ? 0.08 : 0);
      player.antenna.rotation.z = steer * 0.35;
      player.antenna.rotation.x = -(forwardSpeed / maxSpd) * 0.55 + Math.sin(now * 0.015) * 0.08;
      player.wheels.forEach(w => w.children[0].rotation.x += forwardSpeed * 0.25);

      // --- НАДІЙНИЙ ПІДРАХУНОК КІЛ (СИСТЕМА ЧЕКПОЇНТІВ) ---
      const curT = tracks[currentTrackIdx];
      const targetCp = curT.checkpoints[nextCheckpoint];
      const distToCp = Math.hypot(px - targetCp.x, pz - targetCp.z);

      if (distToCp < 15.0) {
        nextCheckpoint = (nextCheckpoint + 1) % curT.checkpoints.length;
        // Перетнув фініш (повернувся до точки 1 після проходження всіх точок)
        if (nextCheckpoint === 1) {
          pLap++;
          if (pLap > 3) {
            pLap = 3;
            if (!isFinished) {
              isFinished = true;
              document.getElementById('finish-banner').style.display = 'block';
            }
          }
        }
      }

      // Бонуси
      pickups.forEach(p => {
        if (!p.active) {
          p.respawn -= dt;
          if (p.respawn <= 0) { p.active = true; p.mesh.visible = true; }
        } else {
          p.mesh.rotation.y += 2.4 * dt;
          p.mesh.position.y = 1.3 + Math.sin(now * 0.004) * 0.25;
          if (Math.hypot(px - p.mesh.position.x, pz - p.mesh.position.z) < 2.6) {
            p.active = false;
            p.mesh.visible = false;
            p.respawn = 5;
            if (!hasItem) {
              hasItem = true;
              document.getElementById('powerup-slot').textContent = '⚡';
              actBtn.style.display = 'flex';
            }
          }
        }
      });

      // AI суперники рухаються по чекпоїнтах
      aiCars.forEach(ai => {
        const target = curT.checkpoints[ai.cpIdx];
        const tdx = target.x - ai.x, tdz = target.z - ai.z;
        const targetAngle = Math.atan2(tdx, tdz);

        let diff = targetAngle - ai.a;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        ai.a += Math.sign(diff) * Math.min(Math.abs(diff), 3.2 * dt);
        ai.x += Math.sin(ai.a) * ai.spd * dt;
        ai.z += Math.cos(ai.a) * ai.spd * dt;

        ai.v.root.position.set(ai.x, 0.05, ai.z);
        ai.v.root.rotation.y = ai.a;
        ai.v.antenna.rotation.x = -0.3 + Math.sin(now * 0.008 + ai.x) * 0.05;
        ai.v.wheels.forEach(w => w.children[0].rotation.x += ai.spd * 0.25);

        if (Math.hypot(tdx, tdz) < 12.0) {
          ai.cpIdx = (ai.cpIdx + 1) % curT.checkpoints.length;
          if (ai.cpIdx === 1) ai.lap++;
        }
      });

      // Рейтинг
      const pScore = (pLap - 1) * curT.checkpoints.length + nextCheckpoint;
      let rank = 1;
      aiCars.forEach(ai => {
        const aiScore = (ai.lap - 1) * curT.checkpoints.length + ai.cpIdx;
        if (aiScore > pScore) rank++;
      });

      document.getElementById('s').textContent = Math.round(Math.abs(forwardSpeed) * 7.5);
      document.getElementById('l').textContent = Math.min(pLap, 3);
      document.getElementById('pos').textContent = rank;

      // Динамічна камера за машинкою
      const camTarget = new THREE.Vector3(
        px - Math.sin(pa) * 9.2,
        5.6,
        pz - Math.cos(pa) * 9.2
      );
      C.position.lerp(camTarget, 0.14);
      C.lookAt(px, 1.2, pz);

      R.render(S, C);
    }
    tick(performance.now());

    window.addEventListener('resize', () => {
      C.aspect = innerWidth / innerHeight;
      C.updateProjectionMatrix();
      R.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
