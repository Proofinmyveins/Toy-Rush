<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Toy Rush</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9ec6df;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
      display: block;
    }
    #hud {
      position: fixed;
      top: env(safe-area-inset-top, 14px);
      left: 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      z-index: 10;
      display: flex;
      gap: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #powerup-slot {
      position: fixed;
      top: env(safe-area-inset-top, 14px);
      right: 14px;
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #ffca28;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 10;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #c {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 10px);
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      pointer-events: none;
    }
    .g {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      pointer-events: auto;
    }
    button {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(20, 20, 25, 0.75);
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      outline: none;
    }
    button:active {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0.94);
    }
    #ACT {
      background: rgba(255, 179, 0, 0.85);
      border-color: #ffe082;
      display: none;
    }
    #RST {
      width: 48px;
      height: 48px;
      font-size: 18px;
      background: rgba(180, 40, 40, 0.8);
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>🏎️ <span id="s">0</span> км/год</span>
    <span>🏁 Коло <span id="l">1</span>/3</span>
    <span>🏆 <span id="pos">1</span>-е</span>
  </div>

  <div id="powerup-slot">❓</div>

  <div id="c">
    <div class="g">
      <button id="L">◀</button>
      <button id="R">▶</button>
      <button id="RST">↺</button>
    </div>
    <div class="g">
      <button id="ACT">⚡</button>
      <button id="B">▼</button>
      <button id="G">▲</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script>
    const S = new THREE.Scene();
    S.background = new THREE.Color(0x9ec6df);
    S.fog = new THREE.Fog(0x9ec6df, 40, 160);

    const C = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
    C.position.set(0, 5, -19.5);
    C.lookAt(0, 0.9, -28);

    const R = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    R.setSize(window.innerWidth, window.innerHeight);
    R.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    R.shadowMap.enabled = true;
    R.shadowMap.type = THREE.PCFShadowMap;
    document.body.appendChild(R.domElement);

    S.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dl = new THREE.DirectionalLight(0xffffff, 1.8);
    dl.position.set(30, 45, 15);
    dl.castShadow = true;
    dl.shadow.mapSize.width = 1024;
    dl.shadow.mapSize.height = 1024;
    dl.shadow.camera.near = 10;
    dl.shadow.camera.far = 140;
    dl.shadow.camera.left = -55;
    dl.shadow.camera.right = 55;
    dl.shadow.camera.top = 55;
    dl.shadow.camera.bottom = -55;
    S.add(dl);

    // Підлога
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(180, 180),
      new THREE.MeshStandardMaterial({ color: 0xb59d79, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    S.add(floor);

    function box(x, z, w, d, h, col) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: col, roughness: 0.6 })
      );
      m.position.set(x, h / 2, z);
      m.castShadow = true;
      m.receiveShadow = true;
      S.add(m);
      return m;
    }

    // Стіни
    box(0, -44, 92, 3, 5, 0x4e3629);
    box(0, 44, 92, 3, 5, 0x4e3629);
    box(-44, 0, 3, 92, 5, 0x4e3629);
    box(44, 0, 3, 92, 5, 0x4e3629);

    // Траса
    const rm = new THREE.MeshStandardMaterial({ color: 0x383838, roughness: 0.9 });
    function road(x, z, w, d) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), rm);
      m.position.set(x, 0.04, z);
      m.receiveShadow = true;
      S.add(m);
    }
    road(0, -28, 70, 11);
    road(28, 0, 11, 56);
    road(0, 28, 70, 11);
    road(-28, 0, 11, 56);

    // Меблі
    box(-22, -17, 14, 8, 5, 0x6d4c41);
    box(22, 16, 12, 7, 5, 0x5d4037);
    box(-22, 23, 8, 10, 4, 0x795548);
    box(23, -23, 10, 6, 4, 0x4e342e);

    // Створення машинки
    function createCar(col) {
      const root = new THREE.Group();
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.3, 0.65, 4),
        new THREE.MeshStandardMaterial({ color: col, metalness: 0.2, roughness: 0.4 })
      );
      body.position.y = 0.65;
      body.castShadow = true;
      bodyGroup.add(body);

      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.6, 1.7),
        new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.3 })
      );
      cabin.position.set(0, 1.1, 0.1);
      cabin.castShadow = true;
      bodyGroup.add(cabin);

      const antennaPole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 2.2),
        new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8 })
      );
      antennaPole.position.y = 1.1;
      const antennaTip = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xff1744 })
      );
      antennaTip.position.y = 2.2;

      const antenna = new THREE.Group();
      antenna.position.set(0, 1.3, -1.2);
      antenna.add(antennaPole);
      antenna.add(antennaTip);
      bodyGroup.add(antenna);

      const wheels = [];
      for (let wx of [-1.15, 1.15]) {
        for (let wz of [-1.25, 1.25]) {
          const w = new THREE.Mesh(
            new THREE.CylinderGeometry(0.44, 0.44, 0.38, 16),
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
          );
          w.rotation.z = Math.PI / 2;
          w.position.set(wx, 0.44, wz);
          w.castShadow = true;
          root.add(w);
          wheels.push(w);
        }
      }

      S.add(root);
      return { root, bodyGroup, antenna, wheels };
    }

    const player = createCar(0xe53935);
    let px = 0, pz = -28, pa = Math.PI, pv = 0, pLap = 1, pProg = 0;
    let boostTimer = 0;
    let hasItem = false;

    const aiCars = [
      { car: createCar(0x1e88e5), x: -4, z: -28, a: Math.PI, v: 16, targetIdx: 1, prog: 0, lap: 1 },
      { car: createCar(0x43a047), x: 4, z: -28, a: Math.PI, v: 14.5, targetIdx: 1, prog: 0, lap: 1 }
    ];

    const pts = [
      [0, -28], [28, -28], [28, -14], [28, 0], [28, 14], [28, 28],
      [14, 28], [0, 28], [-14, 28], [-28, 28], [-28, 14], [-28, 0],
      [-28, -14], [-28, -28], [-14, -28]
    ];

    const pickups = [];
    const pickupGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
    const pickupMat = new THREE.MeshStandardMaterial({
      color: 0xffca28,
      emissive: 0xff6f00,
      emissiveIntensity: 0.4,
      roughness: 0.2
    });

    [[28, 0], [0, 28], [-28, 0]].forEach(p => {
      const mesh = new THREE.Mesh(pickupGeo, pickupMat);
      mesh.position.set(p[0], 1.2, p[1]);
      S.add(mesh);
      pickups.push({ mesh, active: true, respawn: 0 });
    });

    const I = { l: 0, r: 0, g: 0, b: 0 };
    function bind(id, k) {
      const e = document.getElementById(id);
      if (!e) return;
      const down = ev => { ev.preventDefault(); I[k] = 1; };
      const up = ev => { ev.preventDefault(); I[k] = 0; };
      e.addEventListener('pointerdown', down);
      e.addEventListener('pointerup', up);
      e.addEventListener('pointercancel', up);
      e.addEventListener('pointerleave', up);
    }
    bind('L', 'l'); bind('R', 'r'); bind('G', 'g'); bind('B', 'b');

    const actBtn = document.getElementById('ACT');
    function usePowerup() {
      if (!hasItem) return;
      hasItem = false;
      boostTimer = 2.5;
      document.getElementById('powerup-slot').textContent = '❓';
      actBtn.style.display = 'none';
    }
    actBtn.addEventListener('pointerdown', ev => { ev.preventDefault(); usePowerup(); });

    function resetCar() {
      const curPt = pts[Math.floor(pProg) % pts.length];
      px = curPt[0];
      pz = curPt[1];
      pv = 0;
    }
    document.getElementById('RST').addEventListener('pointerdown', ev => { ev.preventDefault(); resetCar(); });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') I.l = 1;
      if (e.key === 'ArrowRight' || e.key === 'd') I.r = 1;
      if (e.key === 'ArrowUp' || e.key === 'w') I.g = 1;
      if (e.key === 'ArrowDown' || e.key === 's') I.b = 1;
      if (e.code === 'Space') usePowerup();
      if (e.key === 'r') resetCar();
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') I.l = 0;
      if (e.key === 'ArrowRight' || e.key === 'd') I.r = 0;
      if (e.key === 'ArrowUp' || e.key === 'w') I.g = 0;
      if (e.key === 'ArrowDown' || e.key === 's') I.b = 0;
    });

    function getProgress(cx, cz) {
      let best = 1e9, o = 0;
      for (let i = 0; i < pts.length; i++) {
        let A = pts[i], B = pts[(i + 1) % pts.length];
        let dx = B[0] - A[0], dz = B[1] - A[1];
        let q = ((cx - A[0]) * dx + (cz - A[1]) * dz) / (dx * dx + dz * dz);
        q = Math.max(0, Math.min(1, q));
        let tx = A[0] + dx * q, tz = A[1] + dz * q;
        let d = (cx - tx) ** 2 + (cz - tz) ** 2;
        if (d < best) { best = d; o = i + q; }
      }
      return o;
    }

    const clock = new THREE.Clock();
    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      const maxSpeed = boostTimer > 0 ? 42 : 26;
      const accel = boostTimer > 0 ? 35 : 20;
      if (boostTimer > 0) boostTimer -= dt;

      if (I.g) pv += accel * dt;
      if (I.b) pv -= 30 * dt;
      pv *= 0.975;
      pv = Math.max(-7, Math.min(maxSpeed, pv));

      const steerInput = (I.r ? 1 : 0) - (I.l ? 1 : 0);
      pa += steerInput * 2.8 * dt * (Math.abs(pv) / 14 + 0.15);
      px += Math.sin(pa) * pv * dt;
      pz += Math.cos(pa) * pv * dt;
      px = Math.max(-41, Math.min(41, px));
      pz = Math.max(-41, Math.min(41, pz));

      player.root.position.set(px, 0.05, pz);
      player.root.rotation.y = pa;
      player.bodyGroup.rotation.z = -steerInput * 0.12 * (pv / maxSpeed);
      player.bodyGroup.rotation.x = (I.g ? -0.05 : 0) + (I.b ? 0.08 : 0);
      player.antenna.rotation.z = steerInput * 0.35;
      player.antenna.rotation.x = -(pv / maxSpeed) * 0.45 + Math.sin(elapsed * 12) * 0.05;
      player.wheels.forEach(w => w.rotation.x += pv * 0.25);

      const q = getProgress(px, pz);
      if (q > pts.length - 1 && pProg < 1.5) {
        pLap++;
        if (pLap > 3) pLap = 3;
      }
      pProg = q;

      pickups.forEach(p => {
        if (!p.active) {
          p.respawn -= dt;
          if (p.respawn <= 0) {
            p.active = true;
            p.mesh.visible = true;
          }
        } else {
          p.mesh.rotation.y += 2 * dt;
          p.mesh.position.y = 1.2 + Math.sin(elapsed * 3) * 0.25;

          if (Math.hypot(px - p.mesh.position.x, pz - p.mesh.position.z) < 2.3) {
            p.active = false;
            p.mesh.visible = false;
            p.respawn = 6;
            if (!hasItem) {
              hasItem = true;
              document.getElementById('powerup-slot').textContent = '⚡';
              actBtn.style.display = 'flex';
            }
          }
        }
      });

      aiCars.forEach(ai => {
        const target = pts[ai.targetIdx];
        const tdx = target[0] - ai.x;
        const tdz = target[1] - ai.z;
        const targetAngle = Math.atan2(tdx, tdz);

        let diff = targetAngle - ai.a;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        ai.a += Math.sign(diff) * Math.min(Math.abs(diff), 3.0 * dt);
        ai.x += Math.sin(ai.a) * ai.v * dt;
        ai.z += Math.cos(ai.a) * ai.v * dt;

        ai.car.root.position.set(ai.x, 0.05, ai.z);
        ai.car.root.rotation.y = ai.a;
        ai.car.antenna.rotation.x = -0.25 + Math.sin(elapsed * 10 + ai.x) * 0.05;
        ai.car.wheels.forEach(w => w.rotation.x += ai.v * 0.25);

        if (Math.hypot(tdx, tdz) < 4.5) {
          ai.targetIdx = (ai.targetIdx + 1) % pts.length;
        }

        const aiQ = getProgress(ai.x, ai.z);
        if (aiQ > pts.length - 1 && ai.prog < 1.5) ai.lap++;
        ai.prog = aiQ;
      });

      const playerTotalScore = (pLap - 1) * pts.length + pProg;
      let rank = 1;
      aiCars.forEach(ai => {
        const aiScore = (ai.lap - 1) * pts.length + ai.prog;
        if (aiScore > playerTotalScore) rank++;
      });

      document.getElementById('s').textContent = Math.round(Math.abs(pv) * 8);
      document.getElementById('l').textContent = Math.min(pLap, 3);
      document.getElementById('pos').textContent = rank;

      const camTarget = new THREE.Vector3(
        px - Math.sin(pa) * 8.5,
        4.8,
        pz - Math.cos(pa) * 8.5
      );
      C.position.lerp(camTarget, 0.12);
      C.lookAt(px, 0.9, pz);

      R.render(S, C);
    }
    tick();

    window.addEventListener('resize', () => {
      C.aspect = window.innerWidth / window.innerHeight;
      C.updateProjectionMatrix();
      R.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
