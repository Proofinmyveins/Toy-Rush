<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Toy Rush - Re-Volt</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #1e272e; touch-action: none;
      -webkit-user-select: none; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 1; }
    
    #hud {
      position: fixed; top: env(safe-area-inset-top, 14px); left: 14px;
      background: rgba(10, 15, 25, 0.9); color: #fff; padding: 8px 16px;
      border-radius: 12px; font-size: 14px; font-weight: 800; display: flex; gap: 12px;
      border: 1px solid rgba(255,255,255,0.25); z-index: 10;
    }
    #powerup-slot {
      position: fixed; top: env(safe-area-inset-top, 14px); right: 14px;
      width: 44px; height: 44px; background: rgba(10, 15, 25, 0.9);
      border: 2px solid #ffca28; border-radius: 12px; color: #fff;
      font-size: 22px; display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    #c {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 16px) + 10px);
      left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px;
      z-index: 10; pointer-events: none;
    }
    .g { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
    button {
      width: 68px; height: 68px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(25, 32, 48, 0.85);
      color: #fff; font-size: 26px; font-weight: bold; display: flex;
      align-items: center; justify-content: center; outline: none;
    }
    button:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.92); }
    #ACT { background: rgba(255, 179, 0, 0.95); border-color: #ffe082; display: none; }
    #RST { width: 48px; height: 48px; font-size: 18px; background: rgba(214, 48, 49, 0.9); }
  </style>
</head>
<body>

  <div id="hud">
    <span>🏎️ <span id="s">0</span> км/год</span>
    <span>🏁 Коло <span id="l">1</span>/3</span>
  </div>
  <div id="powerup-slot">❓</div>

  <div id="c">
    <div class="g">
      <button id="L">◀</button>
      <button id="R">▶</button>
      <button id="RST">↺</button>
    </div>
    <div class="g">
      <button id="ACT">⚡</button>
      <button id="B">▼</button>
      <button id="G">▲</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const S = new THREE.Scene();
    S.background = new THREE.Color(0x3a506b);
    S.fog = new THREE.Fog(0x3a506b, 80, 320);

    const C = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
    const R = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    R.setSize(innerWidth, innerHeight);
    R.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    R.toneMapping = THREE.ACESFilmicToneMapping;
    R.toneMappingExposure = 1.25;
    document.body.appendChild(R.domElement);

    // Світло: чіткі тіні та об'єм
    S.add(new THREE.AmbientLight(0xffeedd, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.3);
    sun.position.set(50, 90, 40);
    S.add(sun);
    const sky = new THREE.DirectionalLight(0x5bc0be, 0.5);
    sky.position.set(-50, 40, -40);
    S.add(sky);

    // Підлога кімнати (дерев'яна підлога)
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x8a6847 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), floorMat);
    floor.rotation.x = -Math.PI / 2;
    S.add(floor);

    // --- СТВОРЕННЯ ЦІЛЬНОЇ ТРАСИ БЕЗ ХАОСУ ТА ГЛУХИХ ПЕРЕГОРОДОК ---
    const trackGroup = new THREE.Group();
    S.add(trackGroup);

    const asphaltMat = new THREE.MeshLambertMaterial({ color: 0x222629 });
    const curbR = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
    const curbW = new THREE.MeshLambertMaterial({ color: 0xecf0f1 });

    // Прямокутні межі траси: центральна лінія треку утворює велике коло зі зрізаними кутами
    // Траса завширшки 20 метрів:
    // Пряма 1 (старт): z від -90 до 90, x = 60
    // Пряма 2 (фініш): z від 90 до -90, x = -60
    // Повороти з'єднують їх угорі (z = 90) та внизу (z = -90)

    function buildSegment(x, z, w, d, rotY = 0) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), asphaltMat);
      m.position.set(x, 0.1, z);
      m.rotation.y = rotY;
      trackGroup.add(m);
    }

    // Полотно дороги
    buildSegment(60, 0, 22, 160);       // Східна пряма (старт)
    buildSegment(-60, 0, 22, 160);      // Західна пряма
    buildSegment(0, 80, 140, 22);       // Північна пряма
    buildSegment(0, -80, 140, 22);      // Південна пряма

    // ТРАМПЛІН НА СХІДНІЙ ПРЯМІЙ (x = 60, z від -15 до 15)
    const rampGroup = new THREE.Group();
    const rampGeom = new THREE.BoxGeometry(22, 0.4, 18);
    const rampMat = new THREE.MeshLambertMaterial({ color: 0x2980b9 });
    const ramp = new THREE.Mesh(rampGeom, rampMat);
    ramp.rotation.x = 0.22; // підйом вгору
    ramp.position.set(60, 1.8, -5);
    rampGroup.add(ramp);

    // Зона обриву (машинка злітає в повітря через перешкоду)
    const pit = new THREE.Mesh(new THREE.BoxGeometry(22, 0.2, 14), floorMat);
    pit.position.set(60, 0.1, 10);
    trackGroup.add(rampGroup);

    // Велетенські банки з-під газованки в зоні польоту
    for (let bx of [54, 60, 66]) {
      const can = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 7, 16), new THREE.MeshPhongMaterial({ color: 0xc0392b }));
      can.position.set(bx, 3.5, 9);
      trackGroup.add(can);
    }

    // СУЦІЛЬНІ ЗАХИСНІ БОРТИКИ З ЧІТКОЮ ГЕОМЕТРІЄЮ (НЕ ПЕРЕТИНАЮТЬ ДОРОГУ)
    function buildWallBox(x, z, w, d) {
      const isW = w > d;
      const count = Math.floor((isW ? w : d) / 4);
      for (let i = 0; i < count; i++) {
        const mat = i % 2 === 0 ? curbR : curbW;
        const b = new THREE.Mesh(new THREE.BoxGeometry(isW ? 4 : 0.8, 1.4, isW ? 0.8 : 4), mat);
        if (isW) b.position.set(x - w / 2 + i * 4 + 2, 0.7, z);
        else b.position.set(x, 0.7, z - d / 2 + i * 4 + 2);
        trackGroup.add(b);
      }
    }

    // Зовнішні борти траси (машинка не вилетить назовні)
    buildWallBox(71, 0, 0.8, 182);
    buildWallBox(-71, 0, 0.8, 182);
    buildWallBox(0, 91, 142, 0.8);
    buildWallBox(0, -91, 142, 0.8);

    // Внутрішні борти траси (острів посередині кімнати)
    buildWallBox(49, 0, 0.8, 138);
    buildWallBox(-49, 0, 0.8, 138);
    buildWallBox(0, 69, 98, 0.8);
    buildWallBox(0, -69, 98, 0.8);

    // Шахова фінішна арка
    const archMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
    const arch = new THREE.Group();
    const col1 = new THREE.Mesh(new THREE.BoxGeometry(1, 9, 1), archMat); col1.position.set(49.5, 4.5, -40);
    const col2 = new THREE.Mesh(new THREE.BoxGeometry(1, 9, 1), archMat); col2.position.set(70.5, 4.5, -40);
    const banner = new THREE.Mesh(new THREE.BoxGeometry(22, 2.5, 0.4), new THREE.MeshLambertMaterial({ color: 0xe74c3c }));
    banner.position.set(60, 7.8, -40);
    arch.add(col1); arch.add(col2); arch.add(banner);
    trackGroup.add(arch);

    // --- МОДЕЛЬ МАШИНКИ RE-VOLT RC BANDIT (АЕРОДИНАМІЧНИЙ СПОРТИВНИЙ БОЛІД) ---
    function createRCBandit() {
      const root = new THREE.Group();
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      // Тінь
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(3.0, 4.8),
        new THREE.MeshBasicMaterial({ color: 0x101520, transparent: true, opacity: 0.6 })
      );
      shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.05;
      root.add(shadow);

      const carPaint = new THREE.MeshPhongMaterial({ color: 0xe67e22, shininess: 90, specular: 0x555555 });
      const glassMat = new THREE.MeshPhongMaterial({ color: 0x111921, shininess: 100 });
      const blackTrim = new THREE.MeshLambertMaterial({ color: 0x1e272e });
      const chromeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.1 });

      // Клиноподібний спортивний ніс (звуження спереду)
      const nose = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.0, 1.8, 4), carPaint);
      nose.rotation.y = Math.PI / 4;
      nose.rotation.x = Math.PI / 2;
      nose.position.set(0, 0.48, 1.4);
      bodyGroup.add(nose);

      // Основний монокок
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 2.6), carPaint);
      chassis.position.set(0, 0.55, -0.4);
      bodyGroup.add(chassis);

      // Кабіна-купол
      const cockpit = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.45, 1.5), glassMat);
      cockpit.position.set(0, 0.92, -0.3);
      bodyGroup.add(cockpit);

      // Спортивне антикрило на стійках
      const wing = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.08, 0.7), carPaint);
      wing.position.set(0, 1.35, -1.7);
      wing.rotation.x = -0.15;
      bodyGroup.add(wing);

      const strutL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.2), blackTrim);
      strutL.position.set(-0.7, 1.1, -1.65); bodyGroup.add(strutL);
      const strutR = strutL.clone(); strutR.position.x = 0.7; bodyGroup.add(strutR);

      // Фари (передні жовті діоди)
      for (let fx of [-0.65, 0.65]) {
        const fl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0xf1c40f }));
        fl.position.set(fx, 0.5, 2.2); bodyGroup.add(fl);
      }

      // Антена з червоним поплавком
      const ant = new THREE.Group();
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.6), chromeMat);
      rod.position.y = 1.3;
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xe74c3c }));
      tip.position.y = 2.6;
      ant.position.set(0, 0.9, -1.2);
      ant.add(rod); ant.add(tip);
      bodyGroup.add(ant);

      // Широкі гоночні колеса
      const wheels = [];
      const tireMat = new THREE.MeshLambertMaterial({ color: 0x151515 });
      [[-1.25, 1.2, 0.44, 0.4], [1.25, 1.2, 0.44, 0.4], [-1.35, -1.2, 0.52, 0.55], [1.35, -1.2, 0.52, 0.55]].forEach(cfg => {
        const wg = new THREE.Group();
        const tire = new THREE.Mesh(new THREE.CylinderGeometry(cfg[2], cfg[2], cfg[3], 18), tireMat);
        tire.rotation.z = Math.PI / 2;
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(cfg[2] * 0.58, cfg[2] * 0.58, cfg[3] + 0.02, 8), chromeMat);
        rim.rotation.z = Math.PI / 2;
        wg.add(tire); wg.add(rim);
        wg.position.set(cfg[0], cfg[2], cfg[1]);
        root.add(wg);
        wheels.push(wg);
      });

      S.add(root);
      return { root, bodyGroup, antenna: ant, wheels };
    }

    const player = createRCBandit();

    // Золоті кубики бонусів Re-Volt
    const pickups = [];
    const pickupMat = new THREE.MeshLambertMaterial({ color: 0xf1c40f });
    [[60, -70], [0, 80], [-60, 20]].forEach(pos => {
      const p = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.0, 2.0), pickupMat);
      p.position.set(pos[0], 1.6, pos[1]);
      trackGroup.add(p);
      pickups.push({ mesh: p, active: true, respawn: 0, x: pos[0], z: pos[1] });
    });

    // Фізичні змінні
    let px = 60, py = 0, pz = -60, pvx = 0, pvy = 0, pvz = 0, pa = 0, forwardSpeed = 0;
    let pLap = 1, checkpointReached = false, boostTimer = 0, hasItem = false;
    let isAirborne = false;

    // Керування
    const I = { l: 0, r: 0, g: 0, b: 0 };
    function bind(id, k) {
      const e = document.getElementById(id);
      if (!e) return;
      e.addEventListener('touchstart', ev => { ev.preventDefault(); I[k] = 1; }, { passive: false });
      e.addEventListener('touchend', ev => { ev.preventDefault(); I[k] = 0; }, { passive: false });
      e.addEventListener('touchcancel', ev => { ev.preventDefault(); I[k] = 0; }, { passive: false });
      e.addEventListener('mousedown', () => I[k] = 1);
      e.addEventListener('mouseup', () => I[k] = 0);
      e.addEventListener('mouseleave', () => I[k] = 0);
    }
    bind('L', 'l'); bind('R', 'r'); bind('G', 'g'); bind('B', 'b');

    const actBtn = document.getElementById('ACT');
    function usePowerup() {
      if (!hasItem) return;
      hasItem = false;
      boostTimer = 3.0;
      document.getElementById('powerup-slot').textContent = '❓';
      actBtn.style.display = 'none';
    }
    actBtn.addEventListener('touchstart', ev => { ev.preventDefault(); usePowerup(); }, { passive: false });
    actBtn.onclick = usePowerup;

    function resetCar() {
      px = 60; py = 0.5; pz = -40; pa = 0;
      pvx = 0; pvy = 0; pvz = 0; forwardSpeed = 0;
    }
    document.getElementById('RST').onclick = resetCar;

    // Клавіші на ПК
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') I.l = 1;
      if (e.key === 'ArrowRight' || e.key === 'd') I.r = 1;
      if (e.key === 'ArrowUp' || e.key === 'w') I.g = 1;
      if (e.key === 'ArrowDown' || e.key === 's') I.b = 1;
      if (e.code === 'Space') usePowerup();
      if (e.key === 'r') resetCar();
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') I.l = 0;
      if (e.key === 'ArrowRight' || e.key === 'd') I.r = 0;
      if (e.key === 'ArrowUp' || e.key === 'w') I.g = 0;
      if (e.key === 'ArrowDown' || e.key === 's') I.b = 0;
    });

    // --- СУВОРІ МАТЕМАТИЧНІ КОЛІЗІЇ З БОРТАМИ (БЕЗ ПРОЇЗДУ НАСКРІЗЬ) ---
    function resolveTrackBoundaries() {
      const r = 1.4; // радіус машинки

      // 1. Зовнішні стіни (прямокутник 140x180)
      if (px > 71 - r) { px = 71 - r; forwardSpeed *= -0.4; pvx = -8; }
      if (px < -71 + r) { px = -71 + r; forwardSpeed *= -0.4; pvx = 8; }
      if (pz > 91 - r) { pz = 91 - r; forwardSpeed *= -0.4; pvz = -8; }
      if (pz < -91 + r) { pz = -91 + r; forwardSpeed *= -0.4; pvz = 8; }

      // 2. Внутрішній острів кімнати (прямокутник від -49 до 49 по X, від -69 до 69 по Z)
      if (px > -49 - r && px < 49 + r && pz > -69 - r && pz < 69 + r) {
        // Знаходимо найближчий вихід з внутрішнього борта
        const dRight = (49 + r) - px;
        const dLeft = px - (-49 - r);
        const dTop = (69 + r) - pz;
        const dBottom = pz - (-69 - r);
        const minD = Math.min(dRight, dLeft, dTop, dBottom);

        if (minD === dRight) { px = 49 + r; pvx = 8; }
        else if (minD === dLeft) { px = -49 - r; pvx = -8; }
        else if (minD === dTop) { pz = 69 + r; pvz = 8; }
        else { pz = -69 - r; pvz = -8; }
        forwardSpeed *= -0.4;
      }
    }

    let lastTime = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Динаміка прискорення
      const maxSpd = boostTimer > 0 ? 46 : 30;
      const accelRate = boostTimer > 0 ? 45 : 28;
      if (boostTimer > 0) boostTimer -= dt;

      if (I.g) forwardSpeed += accelRate * dt;
      if (I.b) forwardSpeed -= 36 * dt;
      forwardSpeed *= 0.984;
      forwardSpeed = Math.max(-9, Math.min(maxSpd, forwardSpeed));

      // Кермо (повертає тільки коли є рух)
      const steer = (I.r ? 1 : 0) - (I.l ? 1 : 0);
      const moveDir = forwardSpeed >= -0.1 ? 1 : -1;
      pa -= steer * 3.2 * dt * (Math.abs(forwardSpeed) / 14 + 0.25) * moveDir;

      // Інерційний вектор
      const targetVx = Math.sin(pa) * forwardSpeed;
      const targetVz = Math.cos(pa) * forwardSpeed;
      pvx += (targetVx - pvx) * 9.0 * dt;
      pvz += (targetVz - pvz) * 9.0 * dt;

      px += pvx * dt;
      pz += pvz * dt;

      // Перевірка колізій із бортиками
      resolveTrackBoundaries();

      // --- ФІЗИКА ТРАМПЛІНА ТА ПОЛЬОТУ В ПОВІТРІ ---
      // Рампа знаходиться на: x близько 60, z від -14 до 4
      if (Math.abs(px - 60) < 10 && pz > -14 && pz < 4) {
        py = Math.max(0, (pz - (-14)) * 0.22); // плавний заїзд по похилій рампі вгору
      } else if (Math.abs(px - 60) < 10 && pz >= 4 && pz < 18) {
        // Зліт з обриву трампліна!
        if (!isAirborne && forwardSpeed > 15) {
          isAirborne = true;
          pvy = forwardSpeed * 0.35; // вертикальний імпульс підкидання
        }
      }

      // Гравітація в польоті
      if (py > 0 || isAirborne) {
        pvy -= 38 * dt; // сила тяжіння
        py += pvy * dt;
        if (py <= 0) {
          py = 0;
          pvy = 0;
          isAirborne = false; // приземлення
        }
      }

      // Оновлення моделі гравця
      player.root.position.set(px, py + 0.05, pz);
      player.root.rotation.y = pa;
      player.bodyGroup.rotation.z = -steer * 0.16 * (Math.abs(forwardSpeed) / maxSpd);
      player.bodyGroup.rotation.x = isAirborne ? -0.25 : (I.g ? -0.05 : 0) + (I.b ? 0.08 : 0);
      player.antenna.rotation.x = -(forwardSpeed / maxSpd) * 0.6 + Math.sin(now * 0.015) * 0.08;
      player.wheels.forEach(w => w.children[0].rotation.x += forwardSpeed * 0.25);

      // Чекпоїнт та кола (половина кола на протилежному боці)
      if (px < -40 && pz > 0) checkpointReached = true;
      if (checkpointReached && px > 40 && pz < -30) {
        checkpointReached = false;
        pLap++;
        if (pLap > 3) pLap = 3;
      }

      // Бонуси
      pickups.forEach(p => {
        if (!p.active) {
          p.respawn -= dt;
          if (p.respawn <= 0) { p.active = true; p.mesh.visible = true; }
        } else {
          p.mesh.rotation.y += 2.4 * dt;
          if (Math.hypot(px - p.x, pz - p.z) < 2.8) {
            p.active = false; p.mesh.visible = false; p.respawn = 5;
            if (!hasItem) {
              hasItem = true;
              document.getElementById('powerup-slot').textContent = '⚡';
              actBtn.style.display = 'flex';
            }
          }
        }
      });

      // HUD
      document.getElementById('s').textContent = Math.round(Math.abs(forwardSpeed) * 7.5);
      document.getElementById('l').textContent = Math.min(pLap, 3);

      // Динамічна камера Re-Volt позаду машинки
      const camTarget = new THREE.Vector3(
        px - Math.sin(pa) * 10.0,
        py + 5.2,
        pz - Math.cos(pa) * 10.0
      );
      C.position.lerp(camTarget, 0.14);
      C.lookAt(px, py + 1.1, pz);

      R.render(S, C);
    }
    tick(performance.now());

    window.addEventListener('resize', () => {
      C.aspect = innerWidth / innerHeight;
      C.updateProjectionMatrix();
      R.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
