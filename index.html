<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Toy Rush</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;touch-action:none;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:12px;left:12px;z-index:2;color:#fff;background:#0009;border-radius:12px;padding:10px 14px;font-weight:700}
#message{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);z-index:3;color:#fff;font-size:42px;font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none}
.controls{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:space-between;padding:0 18px;z-index:4}
.group{display:flex;gap:12px}
button{width:70px;height:70px;border-radius:50%;border:2px solid #fff8;background:#222b;color:white;font-size:27px;font-weight:900}
button:active{background:#fff5}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">🏎️ <span id="speed">0</span> км/ч · Круг <span id="lap">1</span>/3</div>
<div id="message">GO!</div>
<div class="controls">
  <div class="group"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="group"><button id="brake">▼</button><button id="gas">▲</button></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const input={left:false,right:false,gas:false,brake:false};
function bind(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();input[key]=false}));
}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.left=true;if(e.key==='ArrowRight'||e.key==='d')input.right=true;if(e.key==='ArrowUp'||e.key==='w')input.gas=true;if(e.key==='ArrowDown'||e.key==='s')input.brake=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.left=false;if(e.key==='ArrowRight'||e.key==='d')input.right=false;if(e.key==='ArrowUp'||e.key==='w')input.gas=false;if(e.key==='ArrowDown'||e.key==='s')input.brake=false});

const track=[[0,0],[420,0],[620,180],[620,500],[420,680],[-120,680],[-360,500],[-360,160],[-180,0]];
const furniture=[[-210,-180,140,90],[170,250,130,70],[-190,400,100,120],[270,-70,110,100]];
const car={x:0,y:65,a:-Math.PI/2,v:0,lap:1,progress:0};
let running=false,last=performance.now();

setTimeout(()=>{document.getElementById('message').textContent='';running=true},900);

function progress(){
 let best=Infinity,out=0;
 for(let i=0;i<track.length;i++){
  const a=track[i],b=track[(i+1)%track.length],dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  let t=((car.x-a[0])*dx+(car.y-a[1])*dy)/l;t=Math.max(0,Math.min(1,t));
  const px=a[0]+dx*t,py=a[1]+dy*t,d=(car.x-px)**2+(car.y-py)**2;
  if(d<best){best=d;out=i+t}
 }
 return out;
}
function update(dt){
 if(!running)return;
 if(input.gas)car.v+=260*dt;
 if(input.brake)car.v-=340*dt;
 car.v*=Math.pow(.30,dt);
 car.v=Math.max(-90,Math.min(520,car.v));
 const steer=(input.left?-1:0)+(input.right?1:0);
 car.a+=steer*2.7*dt*(Math.abs(car.v)/300+.25);
 car.x+=Math.cos(car.a)*car.v*dt;
 car.y+=Math.sin(car.a)*car.v*dt;
 const p=progress();
 if(p>8.2 && car.progress<1.5){
   car.lap++;
   if(car.lap>3){
     running=false;
     document.getElementById('message').textContent='🏁 ФИНИШ!';
     setTimeout(()=>location.reload(),1800);
   }
 }
 car.progress=p;
 document.getElementById('speed').textContent=Math.round(Math.abs(car.v)*.28);
 document.getElementById('lap').textContent=Math.min(car.lap,3);
}
function ws(x,y,cx,cy,s){return[W/2+(x-cx)*s,H/2+(y-cy)*s]}
function draw(){
 ctx.clearRect(0,0,W,H);
 const cx=car.x+Math.cos(car.a)*170,cy=car.y+Math.sin(car.a)*170;
 const s=Math.max(.72,Math.min(1.1,Math.min(W/1000,H/800)));
 ctx.fillStyle='#b9aa8f';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#a3957c';ctx.lineWidth=1;
 for(let x=-2000;x<2000;x+=80)for(let y=-2000;y<2000;y+=80){let q=ws(x,y,cx,cy,s);ctx.strokeRect(q[0],q[1],80*s,80*s)}
 ctx.beginPath();track.forEach((p,i)=>{let q=ws(p[0],p[1],cx,cy,s);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});let q=ws(track[0][0],track[0][1],cx,cy,s);ctx.lineTo(q[0],q[1]);
 ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#333';ctx.lineWidth=175*s;ctx.stroke();ctx.strokeStyle='#777';ctx.lineWidth=150*s;ctx.stroke();
 let f=ws(0,0,cx,cy,s);for(let i=-4;i<5;i++)for(let j=-1;j<2;j++)if((i+j)%2===0){ctx.fillStyle='#fff';ctx.fillRect(f[0]+i*16*s,f[1]+j*16*s,16*s,16*s)}
 furniture.forEach(o=>{let q=ws(o[0],o[1],cx,cy,s);ctx.fillStyle='#5f3a22';ctx.fillRect(q[0],q[1],o[2]*s,o[3]*s);ctx.fillStyle='#8c5a34';ctx.fillRect(q[0]+8*s,q[1]+8*s,(o[2]-16)*s,(o[3]-16)*s)});
 let p=ws(car.x,car.y,cx,cy,s);ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(car.a);
 ctx.fillStyle='#111';ctx.fillRect(-25*s,-18*s,50*s,36*s);ctx.fillStyle='#e43b35';ctx.fillRect(-24*s,-14*s,48*s,28*s);
 ctx.fillStyle='#8edcff';ctx.fillRect(-5*s,-11*s,18*s,22*s);ctx.fillStyle='#fff';ctx.fillRect(18*s,-10*s,7*s,7*s);ctx.fillRect(18*s,3*s,7*s,7*s);ctx.restore();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
