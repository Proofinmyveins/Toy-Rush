<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Toy Rush 3D</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #87b5d1; touch-action: none;
      -webkit-user-select: none; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 1; display: block; }
    #top-bar {
      position: fixed; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none;
    }
    #hud {
      background: rgba(15, 20, 30, 0.85); color: #fff; padding: 8px 14px;
      border-radius: 12px; font-size: 13px; font-weight: 700; display: flex; gap: 10px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid #ffffff22;
    }
    .top-btns { display: flex; gap: 8px; pointer-events: auto; }
    .ui-btn {
      height: 42px; padding: 0 12px; background: rgba(15, 20, 30, 0.85);
      border: 1px solid #ffffff33; border-radius: 12px; color: #fff;
      font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #powerup-slot { width: 42px; font-size: 20px; border-color: #ffca28; }
    #c {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 16px) + 10px);
      left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px;
      z-index: 10; pointer-events: none;
    }
    .g { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
    button {
      width: 66px; height: 66px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(20, 24, 35, 0.82);
      color: #fff; font-size: 24px; font-weight: bold; display: flex;
      align-items: center; justify-content: center; outline: none;
    }
    button:active { background: rgba(255, 255, 255, 0.35); transform: scale(0.94); }
    #ACT { background: rgba(255, 179, 0, 0.9); border-color: #ffe082; display: none; }
    #RST { width: 48px; height: 48px; font-size: 18px; background: rgba(180, 40, 40, 0.85); }
    #track-menu {
      position: fixed; top: 65px; right: 12px; background: rgba(15, 20, 30, 0.95);
      padding: 10px; border-radius: 12px; border: 1px solid #ffffff33; display: none;
      flex-direction: column; gap: 6px; z-index: 20;
    }
    #track-menu button {
      width: 140px; height: 36px; border-radius: 8px; font-size: 12px;
      background: #2a3348; border: none;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <div id="hud">
      <span>🏎️ <span id="s">0</span></span>
      <span>🏁 <span id="l">1</span>/3</span>
      <span>🏆 <span id="pos">1</span></span>
    </div>
    <div class="top-btns">
      <div id="powerup-slot" class="ui-btn">❓</div>
      <div id="map-btn" class="ui-btn">🗺️ Карта</div>
    </div>
  </div>

  <div id="track-menu">
    <button onclick="loadTrack(0)">🛋️ Спальня</button>
    <button onclick="loadTrack(1)">⚡ Спідвей</button>
  </div>

  <div id="c">
    <div class="g">
      <button id="L">◀</button>
      <button id="R">▶</button>
      <button id="RST">↺</button>
    </div>
    <div class="g">
      <button id="ACT">⚡</button>
      <button id="B">▼</button>
      <button id="G">▲</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const S = new THREE.Scene();
    S.background = new THREE.Color(0x87b5d1);
    S.fog = new THREE.Fog(0x87b5d1, 45, 170);

    const C = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
    const R = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    R.setSize(innerWidth, innerHeight);
    R.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(R.domElement);

    S.add(new THREE.AmbientLight(0xffffff, 1.05));
    const dl = new THREE.DirectionalLight(0xffffff, 0.85);
    dl.position.set(30, 50, 20);
    S.add(dl);

    // Матеріали
    const floorMat = new THREE.MeshLambertMaterial({ color: 0xbaa182 });
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x543b2b });
    const asphaltMat = new THREE.MeshLambertMaterial({ color: 0x2b2b2b });
    const curbRedMat = new THREE.MeshLambertMaterial({ color: 0xd32f2f });
    const curbWhiteMat = new THREE.MeshLambertMaterial({ color: 0xf5f5f5 });

    // Підлога
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), floorMat);
    floor.rotation.x = -Math.PI / 2;
    S.add(floor);

    // Зовнішні стіни кімнати
    function buildWalls() {
      const g = new THREE.Group();
      const b = (x, z, w, d, h) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        m.position.set(x, h / 2, z);
        g.add(m);
      };
      b(0, -50, 104, 3, 6); b(0, 50, 104, 3, 6);
      b(-50, 0, 3, 104, 6); b(50, 0, 3, 104, 6);
      S.add(g);
    }
    buildWalls();

    // Створення машинки Re-Volt з тінню та деталями
    function createCar(bodyColor) {
      const root = new THREE.Group();

      // М'яка контактна тінь під машинкою
      const shadowMat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.45 });
      const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 4.4), shadowMat);
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.05;
      root.add(shadow);

      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      // Основний кузов
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.6, 3.8),
        new THREE.MeshPhongMaterial({ color: bodyColor, shininess: 40 })
      );
      body.position.y = 0.65;
      bodyGroup.add(body);

      // Кабіна
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.55, 1.8),
        new THREE.MeshPhongMaterial({ color: 0x1a2332, shininess: 90 })
      );
      cabin.position.set(0, 1.1, 0.1);
      bodyGroup.add(cabin);

      // Спойлер
      const wingPlate = new THREE.Mesh(
        new THREE.BoxGeometry(2.3, 0.1, 0.6),
        new THREE.MeshPhongMaterial({ color: bodyColor })
      );
      wingPlate.position.set(0, 1.45, -1.6);
      bodyGroup.add(wingPlate);
      for (let sx of [-0.7, 0.7]) {
        const stand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.2), new THREE.MeshBasicMaterial({ color: 0x111 }));
        stand.position.set(sx, 1.15, -1.6);
        bodyGroup.add(stand);
      }

      // Фари
      const fLightMat = new THREE.MeshBasicMaterial({ color: 0xfff59d });
      const rLightMat = new THREE.MeshBasicMaterial({ color: 0xff1744 });
      for (let fx of [-0.75, 0.75]) {
        const fl = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.18, 0.1), fLightMat);
        fl.position.set(fx, 0.65, 1.9);
        bodyGroup.add(fl);
        const rl = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.1), rLightMat);
        rl.position.set(fx, 0.7, -1.9);
        bodyGroup.add(rl);
      }

      // Антена
      const antennaPole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 2.3),
        new THREE.MeshBasicMaterial({ color: 0xcccccc })
      );
      antennaPole.position.y = 1.15;
      const antennaTip = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff1744 })
      );
      antennaTip.position.y = 2.3;

      const antenna = new THREE.Group();
      antenna.position.set(0, 1.35, -1.1);
      antenna.add(antennaPole);
      antenna.add(antennaTip);
      bodyGroup.add(antenna);

      // Колеса з дисками
      const wheels = [];
      const tireMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
      const rimMat = new THREE.MeshBasicMaterial({ color: 0xdddddd });
      for (let wx of [-1.15, 1.15]) {
        for (let wz of [-1.25, 1.25]) {
          const wGroup = new THREE.Group();
          const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.38, 14), tireMat);
          tire.rotation.z = Math.PI / 2;
          const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.4, 8), rimMat);
          rim.rotation.z = Math.PI / 2;
          wGroup.add(tire);
          wGroup.add(rim);
          wGroup.position.set(wx, 0.44, wz);
          root.add(wGroup);
          wheels.push(wGroup);
        }
      }

      S.add(root);
      return { root, bodyGroup, antenna, wheels };
    }

    // Траси
    const tracks = [
      {
        name: "Спальня",
        pts: [[0, -30], [30, -30], [30, -15], [30, 0], [30, 15], [30, 30], [15, 30], [0, 30], [-15, 30], [-30, 30], [-30, 15], [-30, 0], [-30, -15], [-30, -30], [-15, -30]],
        roads: [
          { x: 0, z: -30, w: 72, d: 12 }, { x: 30, z: 0, w: 12, d: 60 },
          { x: 0, z: 30, w: 72, d: 12 }, { x: -30, z: 0, w: 12, d: 60 }
        ],
        props: [
          { type: 'cube', x: -18, z: -15, s: 7, col: 0x43a047 },
          { type: 'cube', x: 18, z: 15, s: 8, col: 0x1e88e5 },
          { type: 'cube', x: -18, z: 18, s: 6, col: 0xfdd835 },
          { type: 'battery', x: 18, z: -18 }
        ]
      },
      {
        name: "Спідвей",
        pts: [[0, -34], [25, -30], [35, -15], [35, 15], [25, 30], [0, 34], [-25, 30], [-35, 15], [-35, -15], [-25, -30]],
        roads: [
          { x: 0, z: -34, w: 60, d: 12 }, { x: 30, z: 0, w: 14, d: 60 },
          { x: 0, z: 34, w: 60, d: 12 }, { x: -30, z: 0, w: 14, d: 60 }
        ],
        props: [
          { type: 'cube', x: 0, z: 0, s: 10, col: 0x8e24aa },
          { type: 'battery', x: -16, z: 0 },
          { type: 'battery', x: 16, z: 0 }
        ]
      }
    ];

    let currentTrackIdx = 0;
    const trackGroup = new THREE.Group();
    S.add(trackGroup);

    function spawnProps(props) {
      props.forEach(p => {
        if (p.type === 'cube') {
          const m = new THREE.Mesh(new THREE.BoxGeometry(p.s, p.s, p.s), new THREE.MeshLambertMaterial({ color: p.col }));
          m.position.set(p.x, p.s / 2, p.z);
          trackGroup.add(m);
        } else if (p.type === 'battery') {
          const bat = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 7, 16), new THREE.MeshPhongMaterial({ color: 0x212121 }));
          bat.position.set(p.x, 3.5, p.z);
          const top = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.8, 12), new THREE.MeshBasicMaterial({ color: 0xd4af37 }));
          top.position.set(p.x, 7.4, p.z);
          trackGroup.add(bat);
          trackGroup.add(top);
        }
      });
    }

    function spawnCurbs(roads) {
      roads.forEach(r => {
        const isHoriz = r.w > r.d;
        const len = isHoriz ? r.w : r.d;
        const segs = Math.floor(len / 3);
        for (let i = 0; i < segs; i++) {
          const mat = i % 2 === 0 ? curbRedMat : curbWhiteMat;
          const curbMesh1 = new THREE.Mesh(new THREE.BoxGeometry(isHoriz ? 3 : 0.8, 0.22, isHoriz ? 0.8 : 3), mat);
          const curbMesh2 = curbMesh1.clone();
          if (isHoriz) {
            curbMesh1.position.set(r.x - r.w / 2 + i * 3 + 1.5, 0.1, r.z - r.d / 2);
            curbMesh2.position.set(r.x - r.w / 2 + i * 3 + 1.5, 0.1, r.z + r.d / 2);
          } else {
            curbMesh1.position.set(r.x - r.w / 2, 0.1, r.z - r.d / 2 + i * 3 + 1.5);
            curbMesh2.position.set(r.x + r.w / 2, 0.1, r.z - r.d / 2 + i * 3 + 1.5);
          }
          trackGroup.add(curbMesh1);
          trackGroup.add(curbMesh2);
        }
      });
    }

    // Шахова фінішна лінія на дорозі
    function spawnFinishLine(startPt) {
      const g = new THREE.Group();
      for (let x = -5; x <= 5; x += 1.25) {
        for (let z = -1; z <= 1; z += 1) {
          const isBlack = (Math.round((x + 5) / 1.25) + z) % 2 === 0;
          const quad = new THREE.Mesh(
            new THREE.PlaneGeometry(1.25, 1),
            new THREE.MeshBasicMaterial({ color: isBlack ? 0x111111 : 0xffffff })
          );
          quad.rotation.x = -Math.PI / 2;
          quad.position.set(startPt[0] + x, 0.09, startPt[1] + z);
          g.add(quad);
        }
      }
      trackGroup.add(g);
    }

    const pickups = [];
    const pickupMat = new THREE.MeshLambertMaterial({ color: 0xffca28 });
    function buildTrack(idx) {
      while (trackGroup.children.length > 0) {
        trackGroup.remove(trackGroup.children[0]);
      }
      pickups.length = 0;

      const t = tracks[idx];
      t.roads.forEach(r => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(r.w, 0.08, r.d), asphaltMat);
        m.position.set(r.x, 0.04, r.z);
        trackGroup.add(m);
      });

      spawnFinishLine(t.pts[0]);
      spawnCurbs(t.roads);
      spawnProps(t.props);

      [t.pts[2], t.pts[Math.floor(t.pts.length / 2)], t.pts[t.pts.length - 3]].forEach(pos => {
        const p = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), pickupMat);
        p.position.set(pos[0], 1.2, pos[1]);
        trackGroup.add(p);
        pickups.push({ mesh: p, active: true, respawn: 0 });
      });
    }

    const player = createCar(0xe53935);
    const aiCars = [
      { car: createCar(0x1e88e5), x: -3.5, z: -30, a: Math.PI, v: 16.5, targetIdx: 1, prog: 0, lap: 1 },
      { car: createCar(0x43a047), x: 3.5, z: -30, a: Math.PI, v: 15.0, targetIdx: 1, prog: 0, lap: 1 }
    ];

    let px = 0, pz = -30, pvx = 0, pvz = 0, pa = Math.PI, forwardSpeed = 0;
    let pLap = 1, pProg = 0, boostTimer = 0, hasItem = false;

    function resetPositions() {
      const curTrack = tracks[currentTrackIdx];
      px = curTrack.pts[0][0]; pz = curTrack.pts[0][1];
      pvx = 0; pvz = 0; pa = Math.PI; forwardSpeed = 0;
      pLap = 1; pProg = 0;
      aiCars[0].x = px - 3.5; aiCars[0].z = pz; aiCars[0].a = Math.PI; aiCars[0].targetIdx = 1; aiCars[0].lap = 1;
      aiCars[1].x = px + 3.5; aiCars[1].z = pz; aiCars[1].a = Math.PI; aiCars[1].targetIdx = 1; aiCars[1].lap = 1;
    }

    function loadTrack(idx) {
      currentTrackIdx = idx;
      buildTrack(idx);
      resetPositions();
      document.getElementById('track-menu').style.display = 'none';
    }

    document.getElementById('map-btn').onclick = () => {
      const m = document.getElementById('track-menu');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    };

    const I = { l: 0, r: 0, g: 0, b: 0 };
    function bind(id, k) {
      const e = document.getElementById(id);
      if (!e) return;
      e.addEventListener('touchstart', ev => { ev.preventDefault(); I[k] = 1; }, { passive: false });
      e.addEventListener('touchend', ev => { ev.preventDefault(); I[k] = 0; }, { passive: false });
      e.addEventListener('touchcancel', ev => { ev.preventDefault(); I[k] = 0; }, { passive: false });
      e.addEventListener('mousedown', () => I[k] = 1);
      e.addEventListener('mouseup', () => I[k] = 0);
      e.addEventListener('mouseleave', () => I[k] = 0);
    }
    bind('L', 'l'); bind('R', 'r'); bind('G', 'g'); bind('B', 'b');

    const actBtn = document.getElementById('ACT');
    function usePowerup() {
      if (!hasItem) return;
      hasItem = false;
      boostTimer = 2.8;
      document.getElementById('powerup-slot').textContent = '❓';
      actBtn.style.display = 'none';
    }
    actBtn.addEventListener('touchstart', ev => { ev.preventDefault(); usePowerup(); }, { passive: false });
    actBtn.onclick = usePowerup;

    const rstBtn = document.getElementById('RST');
    function resetCar() {
      const curPts = tracks[currentTrackIdx].pts;
      const curPt = curPts[Math.floor(pProg) % curPts.length];
      px = curPt[0]; pz = curPt[1];
      pvx = 0; pvz = 0; forwardSpeed = 0;
    }
    rstBtn.addEventListener('touchstart', ev => { ev.preventDefault(); resetCar(); }, { passive: false });
    rstBtn.onclick = resetCar;

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') I.l = 1;
      if (e.key === 'ArrowRight' || e.key === 'd') I.r = 1;
      if (e.key === 'ArrowUp' || e.key === 'w') I.g = 1;
      if (e.key === 'ArrowDown' || e.key === 's') I.b = 1;
      if (e.code === 'Space') usePowerup();
      if (e.key === 'r') resetCar();
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') I.l = 0;
      if (e.key === 'ArrowRight' || e.key === 'd') I.r = 0;
      if (e.key === 'ArrowUp' || e.key === 'w') I.g = 0;
      if (e.key === 'ArrowDown' || e.key === 's') I.b = 0;
    });

    // Фізичний колідер: відштовхування від кубиків, батарейок і зовнішніх стін
    function resolveSolidCollisions(entity, isPlayer) {
      const carRadius = 1.35;
      
      // Межі стін кімнати
      if (entity.x > 46.5) { entity.x = 46.5; if (isPlayer) { forwardSpeed *= -0.4; pvx = -8; } }
      if (entity.x < -46.5) { entity.x = -46.5; if (isPlayer) { forwardSpeed *= -0.4; pvx = 8; } }
      if (entity.z > 46.5) { entity.z = 46.5; if (isPlayer) { forwardSpeed *= -0.4; pvz = -8; } }
      if (entity.z < -46.5) { entity.z = -46.5; if (isPlayer) { forwardSpeed *= -0.4; pvz = 8; } }

      // Перешкоди на карті
      const curProps = tracks[currentTrackIdx].props;
      for (let p of curProps) {
        if (p.type === 'cube') {
          const hw = p.s / 2;
          const hd = p.s / 2;
          const cx = Math.max(p.x - hw, Math.min(p.x + hw, entity.x));
          const cz = Math.max(p.z - hd, Math.min(p.z + hd, entity.z));
          const dx = entity.x - cx;
          const dz = entity.z - cz;
          const distSq = dx * dx + dz * dz;

          if (distSq < carRadius * carRadius) {
            const dist = Math.sqrt(distSq) || 0.001;
            const push = carRadius - dist;
            entity.x += (dx / dist) * push;
            entity.z += (dz / dist) * push;
            if (isPlayer) {
              forwardSpeed *= -0.45;
              pvx = (dx / dist) * 12;
              pvz = (dz / dist) * 12;
            }
          }
        } else if (p.type === 'battery') {
          const br = 2.1 + carRadius;
          const dx = entity.x - p.x;
          const dz = entity.z - p.z;
          const distSq = dx * dx + dz * dz;

          if (distSq < br * br) {
            const dist = Math.sqrt(distSq) || 0.001;
            const push = br - dist;
            entity.x += (dx / dist) * push;
            entity.z += (dz / dist) * push;
            if (isPlayer) {
              forwardSpeed *= -0.45;
              pvx = (dx / dist) * 12;
              pvz = (dz / dist) * 12;
            }
          }
        }
      }
    }

    function getProgress(cx, cz) {
      const curPts = tracks[currentTrackIdx].pts;
      let best = 1e9, o = 0;
      for (let i = 0; i < curPts.length; i++) {
        let A = curPts[i], B = curPts[(i + 1) % curPts.length];
        let dx = B[0] - A[0], dz = B[1] - A[1];
        let q = ((cx - A[0]) * dx + (cz - A[1]) * dz) / (dx * dx + dz * dz);
        q = Math.max(0, Math.min(1, q));
        let tx = A[0] + dx * q, tz = A[1] + dz * q;
        let d = (cx - tx) * (cx - tx) + (cz - tz) * (cz - tz);
        if (d < best) { best = d; o = i + q; }
      }
      return o;
    }

    loadTrack(0);

    let lastTime = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Прискорення / Турбо
      const maxSpd = boostTimer > 0 ? 44 : 27;
      const accel = boostTimer > 0 ? 38 : 22;
      if (boostTimer > 0) boostTimer -= dt;

      if (I.g) forwardSpeed += accel * dt;
      if (I.b) forwardSpeed -= 32 * dt;
      forwardSpeed *= 0.98;
      forwardSpeed = Math.max(-8, Math.min(maxSpd, forwardSpeed));

      // Кермо (правильний напрямок: мінус замість плюса)
      const steer = (I.r ? 1 : 0) - (I.l ? 1 : 0);
      const moveDirection = forwardSpeed >= -0.1 ? 1 : -1;
      pa -= steer * 3.0 * dt * (Math.abs(forwardSpeed) / 13 + 0.2) * moveDirection;

      // Фізика інерції та дрифту
      const targetVx = Math.sin(pa) * forwardSpeed;
      const targetVz = Math.cos(pa) * forwardSpeed;
      pvx += (targetVx - pvx) * 8.5 * dt;
      pvz += (targetVz - pvz) * 8.5 * dt;

      px += pvx * dt;
      pz += pvz * dt;

      // Перевірка колізій із меблями та стінами для гравця
      const playerEntity = { x: px, z: pz };
      resolveSolidCollisions(playerEntity, true);
      px = playerEntity.x;
      pz = playerEntity.z;

      // Колізії між гравцем та AI-суперниками
      aiCars.forEach(ai => {
        const dx = px - ai.x;
        const dz = pz - ai.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 2.6 && dist > 0.01) {
          const nx = dx / dist;
          const nz = dz / dist;
          const overlap = 2.6 - dist;
          px += nx * overlap * 0.5;
          pz += nz * overlap * 0.5;
          ai.x -= nx * overlap * 0.5;
          ai.z -= nz * overlap * 0.5;
          pvx += nx * 6;
          pvz += nz * 6;
          forwardSpeed *= 0.65;
        }
      });

      // Оновлення моделі машинки
      player.root.position.set(px, 0.05, pz);
      player.root.rotation.y = pa;
      player.bodyGroup.rotation.z = -steer * 0.14 * (Math.abs(forwardSpeed) / maxSpd);
      player.bodyGroup.rotation.x = (I.g ? -0.04 : 0) + (I.b ? 0.07 : 0);
      player.antenna.rotation.z = steer * 0.35;
      player.antenna.rotation.x = -(forwardSpeed / maxSpd) * 0.5 + Math.sin(now * 0.01) * 0.05;
      player.wheels.forEach(w => w.children[0].rotation.x += forwardSpeed * 0.25);

      // Чекпоїнти
      const curPts = tracks[currentTrackIdx].pts;
      const q = getProgress(px, pz);
      if (q > curPts.length - 1 && pProg < 1.5) {
        pLap++;
        if (pLap > 3) pLap = 3;
      }
      pProg = q;

      // Бонуси
      pickups.forEach(p => {
        if (!p.active) {
          p.respawn -= dt;
          if (p.respawn <= 0) { p.active = true; p.mesh.visible = true; }
        } else {
          p.mesh.rotation.y += 2.2 * dt;
          p.mesh.position.y = 1.2 + Math.sin(now * 0.003) * 0.25;
          if (Math.hypot(px - p.mesh.position.x, pz - p.mesh.position.z) < 2.3) {
            p.active = false;
            p.mesh.visible = false;
            p.respawn = 5;
            if (!hasItem) {
              hasItem = true;
              document.getElementById('powerup-slot').textContent = '⚡';
              actBtn.style.display = 'flex';
            }
          }
        }
      });

      // AI суперники з колізіями
      aiCars.forEach(ai => {
        const target = curPts[ai.targetIdx];
        const tdx = target[0] - ai.x;
        const tdz = target[1] - ai.z;
        const targetAngle = Math.atan2(tdx, tdz);

        let diff = targetAngle - ai.a;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        ai.a += Math.sign(diff) * Math.min(Math.abs(diff), 3.2 * dt);
        ai.x += Math.sin(ai.a) * ai.v * dt;
        ai.z += Math.cos(ai.a) * ai.v * dt;

        resolveSolidCollisions(ai, false);

        ai.car.root.position.set(ai.x, 0.05, ai.z);
        ai.car.root.rotation.y = ai.a;
        ai.car.antenna.rotation.x = -0.25 + Math.sin(now * 0.008 + ai.x) * 0.05;
        ai.car.wheels.forEach(w => w.children[0].rotation.x += ai.v * 0.25);

        if (Math.hypot(tdx, tdz) < 4.8) {
          ai.targetIdx = (ai.targetIdx + 1) % curPts.length;
        }

        const aiQ = getProgress(ai.x, ai.z);
        if (aiQ > curPts.length - 1 && ai.prog < 1.5) ai.lap++;
        ai.prog = aiQ;
      });

      // Позиція в гонці
      const pScore = (pLap - 1) * curPts.length + pProg;
      let rank = 1;
      aiCars.forEach(ai => {
        const aiScore = (ai.lap - 1) * curPts.length + ai.prog;
        if (aiScore > pScore) rank++;
      });

      // Оновлення HUD
      document.getElementById('s').textContent = Math.round(Math.abs(forwardSpeed) * 7.5);
      document.getElementById('l').textContent = Math.min(pLap, 3);
      document.getElementById('pos').textContent = rank;

      // Камера слідує за машинкою
      const camTarget = new THREE.Vector3(
        px - Math.sin(pa) * 8.8,
        5.2,
        pz - Math.cos(pa) * 8.8
      );
      C.position.lerp(camTarget, 0.14);
      C.lookAt(px, 1.0, pz);

      R.render(S, C);
    }
    tick(performance.now());

    window.addEventListener('resize', () => {
      C.aspect = innerWidth / innerHeight;
      C.updateProjectionMatrix();
      R.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
